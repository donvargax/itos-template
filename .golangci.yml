# golangci-lint's configuration, version 2. The binary is the release
# tools/bin/pinned pins; the pre-commit hook (tools/hooks/pre-commit) runs it.
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - gochecksumtype
    - gosec
    - revive
  settings:
    # gosec, the SAST baseline (T-22). A rule whose finding is this tool's
    # job is turned off here with its reason; any other finding is fixed, or
    # excepted on its line with a //nolint:gosec saying why, never by
    # turning its rule off for one finding.
    gosec:
      excludes:
        # A program run with variable words: itos-template runs git and a
        # template's checks as lists of words, never through a shell
        # (decision 15), so no word is read as shell syntax.
        - G204
        # A file read by a variable path: the files a template and a made
        # project hold are what this tool reads and writes.
        - G304
        # Folder and file modes wider than owner-only: a made project's
        # files keep the modes a person shares a project with, 0755 for a
        # folder and an executable, 0644 for a file.
        - G301 # a folder made 0755
        - G302 # a file chmodded 0755 or 0644
        - G306 # a file written 0644
    # A file is at most 600 lines of code, comments and blank lines not
    # counted (T-11): decision 17 keeps a slice in one file until it grows
    # large, and this says when. Only this rule of revive's runs.
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
    # The domain's and infra's errors are sealed sets (//sumtype:decl), and
    # internal/cli gives each kind its exit code in one switch per set
    # (decision 17, docs/CLI.md rule 31): a switch that leaves a kind out is
    # refused, and a default case does not count as naming them.
    gochecksumtype:
      default-signifies-exhaustive: false
    # The arrows between the layers (decision 17): the domain and its ports
    # reach the outside only through infra implementing the ports; infra
    # imports nothing of ours but the ports; a slice imports no other slice
    # (decision 17); kong stays in the UI. Each list names every package of
    # its layer, so a new one (a slice, a domain package, an infra) is
    # added where it belongs.
    depguard:
      rules:
        # Each command is a slice, and a slice imports no other (decision 17):
        # what two share belongs to the domain, in a package named for what it
        # models. Every slice is listed twice, under files and under deny, so
        # a new slice (update, sync) is added to both; cmd may import them all.
        slices:
          files:
            - "**/internal/check/**"
            - "**/internal/newproject/**"
          deny:
            - pkg: github.com/donvargax/itos-template/internal/check$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
            - pkg: github.com/donvargax/itos-template/internal/newproject$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
        # The domain and its ports, their tests too: no infra, slice, UI or
        # kong. Its tests run it against porttest's fakes (decision 19).
        domain:
          files:
            - "**/internal/answer/**"
            - "**/internal/caseform/**"
            - "**/internal/manifest/**"
            - "**/internal/project/**"
            - "**/internal/render/**"
            - "**/internal/template/**"
          deny:
            - pkg: github.com/donvargax/itos-template/internal/git$
              desc: "the domain reaches git through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/disk$
              desc: "the domain reaches the file system through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/program$
              desc: "the domain runs programs through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/tempdir$
              desc: "the domain reaches temporary folders through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/prompt$
              desc: "the domain asks through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/check$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/newproject$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/cli$
              desc: "the domain imports no UI (decision 17): internal/cli turns its errors into exit codes and lines"
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI (decision 17)"
        # The domain's own code does no I/O: no os (os/exec with it) and no
        # net. Its tests may read a fixture.
        domain-io:
          files:
            - "**/internal/answer/**"
            - "**/internal/caseform/**"
            - "**/internal/manifest/**"
            - "**/internal/project/**"
            - "**/internal/render/**"
            - "**/internal/template/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "the domain does no I/O (decision 17): reach the outside through a port of internal/template/port"
            - pkg: net
              desc: "the domain does no I/O (decision 17): reach the outside through a port of internal/template/port"
        # Infra implements the ports and imports nothing of ours but them:
        # turning the outside's terms into the ports' is its anti-corruption
        # layer, kept there.
        infra:
          list-mode: lax
          files:
            - "**/internal/disk/**"
            - "**/internal/git/**"
            - "**/internal/program/**"
            - "**/internal/prompt/**"
            - "**/internal/tempdir/**"
          allow:
            - github.com/donvargax/itos-template/internal/template/port$
          deny:
            - pkg: github.com/donvargax/itos-template
              desc: "infra imports nothing of ours but the ports it implements (decision 17)"
        # Tests use our own fakes and stubs, never mocks, which script and
        # check calls (decision 19): no mocking library comes in, in any
        # package or test.
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: go.uber.org/mock
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: github.com/stretchr/testify/mock
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: github.com/vektra/mockery
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
        # Properties are unit tests of the domain (decision 20): rapid comes
        # in only in the domain packages' own tests, never in their code, in
        # porttest, or anywhere else. Each domain package is listed, as under
        # domain above.
        rapid:
          files:
            - $all
            - "!**/internal/answer/*_test.go"
            - "!**/internal/caseform/*_test.go"
            - "!**/internal/manifest/*_test.go"
            - "!**/internal/project/*_test.go"
            - "!**/internal/render/*_test.go"
            - "!**/internal/template/*_test.go"
          deny:
            - pkg: pgregory.net/rapid
              desc: "properties are unit tests of the domain (decision 20): rapid only in the domain packages' _test.go files"
        # kong is the UI's: cmd, internal/cli and the slices.
        kong:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/cli/**"
            - "!**/internal/check/**"
            - "!**/internal/newproject/**"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI (decision 17): cmd, internal/cli and the slices"
  exclusions:
    rules:
      # Test code is left out of gosec: it writes fixtures and runs programs
      # where the test says, in folders the test made. The _test.go files,
      # the scenarios in features/, and the packages that only tests import
      # (releasetest, porttest).
      - path: _test\.go$
        linters: [gosec]
      - path: ^features/
        linters: [gosec]
      - path: ^internal/release/releasetest/
        linters: [gosec]
      - path: ^internal/template/port/porttest/
        linters: [gosec]
formatters:
  enable:
    - gofmt
