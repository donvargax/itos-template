# golangci-lint's configuration, version 2. The binary is the release
# tools/bin/pinned pins; the pre-commit hook (tools/hooks/pre-commit) runs it.
# It holds every code design rule a linter can decide, each linter's comment
# naming the decision it holds; docs/design-rules.md lists every rule and how
# it is held, those left to judgement with why (T-49).
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - forbidigo
    - gochecksumtype
    - gosec
    - nolintlint
    - revive
  settings:
    # forbidigo refuses identifiers, each pattern naming the decision it
    # holds. analyze-types matches an identifier by its package, not by the
    # name a file imports it as, so an alias does not slip past. A pattern
    # holding only some files has its exclusions below, each saying why.
    forbidigo:
      analyze-types: true
      forbid:
        # Decision 26: code that differs by OS takes the OS as a value, and
        # only a thin caller reads runtime.GOOS. Every read is refused, a
        # comparison and a copy compared later alike, and the one read
        # allowed is the edge handing the OS in as a value (its exclusion
        # below). forbidigo rather than gocritic's ruleguard: a ruleguard
        # rule matches shapes, a comparison or a switch, and misses the OS
        # copied into a variable and compared later, while refusing every
        # read but the edge decides the rule whole.
        - pattern: ^runtime\.GOOS$
          pkg: ^runtime$
          msg: "code that differs by OS takes the OS as a value (decision 26): read the OS only at the edge, as template.SystemOf(runtime.GOOS)"
        # Decision 17: the domain knows no UI, and output goes through the
        # writers the UI hands down (cli.UI's), so it is tested and --json
        # keeps stdout to itself: nothing prints to the process's stdout
        # behind them.
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: "output goes through the writers the UI hands down (decision 17): write to the io.Writer given"
        # Decision 17: the domain knows no UI, exit codes included; a slice
        # returns its code and main alone exits with it (cmd's exclusion
        # below). log.Fatal exits too.
        - pattern: ^(os|syscall)\.Exit$
          msg: "main alone exits (decision 17): return the exit code to it"
        - pattern: ^log\.Fatal(f|ln)?$
          msg: "main alone exits (decision 17): return the exit code to it"
        # docs/CLI.md rule 31: a bug exits 70, as an error nobody
        # classified, never as a panic, which exits 2 with a trace. Input
        # is checked at its edge into a value its one constructor makes and
        # trusted after (decision 41), so no inner code meets a case it
        # must panic on; T-52 removed the last one, Replacements'. Tests
        # are left out (below).
        - pattern: ^panic$
          msg: "a bug exits 70, never as a panic (docs/CLI.md rule 31): return an error, or take a value checked at its edge (decision 41)"
        # Decision 22: configuration is read strictly, refusing what JSON
        # cannot say; manifest.Decode is that reader (its exclusion below),
        # so no other code reads YAML loosely.
        - pattern: ^yaml\.(Unmarshal|NewDecoder)$
          pkg: ^go\.yaml\.in/yaml/v3$
          msg: "configuration is read strictly (decision 22): read it with manifest.Decode"
    # An exception is one finding, excepted on its line with the linter it
    # silences named and why, the rule gosec's comment below sets (T-22),
    # here for every linter; one that silences nothing is reported, so an
    # exception goes when its finding does.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    # gosec, the SAST baseline (T-22). A rule whose finding is this tool's
    # job is turned off here with its reason; any other finding is fixed, or
    # excepted on its line with a //nolint:gosec saying why, never by
    # turning its rule off for one finding.
    gosec:
      excludes:
        # A program run with variable words: itos-template runs git and a
        # template's checks as lists of words, never through a shell
        # (decision 15), so no word is read as shell syntax.
        - G204
        # A file read by a variable path: the files a template and a made
        # project hold are what this tool reads and writes.
        - G304
        # Folder and file modes wider than owner-only: a made project's
        # files keep the modes a person shares a project with, 0755 for a
        # folder and an executable, 0644 for a file.
        - G301 # a folder made 0755
        - G302 # a file chmodded 0755 or 0644
        - G306 # a file written 0644
    # A file is at most 600 lines of code, comments and blank lines not
    # counted (T-11): decision 17 keeps a slice in one file until it grows
    # large, and this says when. Only this rule of revive's runs.
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
    # The domain's and infra's errors are sealed sets (//sumtype:decl), and
    # internal/cli gives each kind its exit code in one switch per set
    # (decision 17, docs/CLI.md rule 31): a switch that leaves a kind out is
    # refused, and a default case does not count as naming them.
    gochecksumtype:
      default-signifies-exhaustive: false
    # The arrows between the layers (decision 17): the domain and its ports
    # reach the outside only through infra implementing the ports; infra
    # imports nothing of ours but the ports; a slice imports no other slice
    # (decision 17); kong stays in the UI. Each list names every package of
    # its layer, so a new one (a slice, a domain package, an infra) is
    # added where it belongs.
    depguard:
      rules:
        # Each command is a slice, and a slice imports no other (decision 17):
        # what two share belongs to the domain, in a package named for what it
        # models. Every slice is listed twice, under files and under deny, so
        # a new slice is added to both; cmd may import them all.
        slices:
          files:
            - "**/internal/adopt/**"
            - "**/internal/check/**"
            - "**/internal/cutrelease/**"
            - "**/internal/newproject/**"
            - "**/internal/syncbranch/**"
            - "**/internal/update/**"
          deny:
            - pkg: github.com/donvargax/itos-template/internal/adopt$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
            - pkg: github.com/donvargax/itos-template/internal/check$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
            - pkg: github.com/donvargax/itos-template/internal/cutrelease$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
            - pkg: github.com/donvargax/itos-template/internal/newproject$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
            - pkg: github.com/donvargax/itos-template/internal/syncbranch$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
            - pkg: github.com/donvargax/itos-template/internal/update$
              desc: "a slice imports no other slice (decision 17): move what they share into the domain"
        # The domain and its ports, their tests too: no infra, slice, UI or
        # kong. Its tests run it against porttest's fakes (decision 19).
        domain:
          files:
            - "**/internal/adoption/**"
            - "**/internal/answer/**"
            - "**/internal/caseform/**"
            - "**/internal/manifest/**"
            - "**/internal/project/**"
            - "**/internal/releasing/**"
            - "**/internal/render/**"
            - "**/internal/syncing/**"
            - "**/internal/template/**"
            - "**/internal/updating/**"
          deny:
            - pkg: github.com/donvargax/itos-template/internal/git$
              desc: "the domain reaches git through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/disk$
              desc: "the domain reaches the file system through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/program$
              desc: "the domain runs programs through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/tempdir$
              desc: "the domain reaches temporary folders through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/prompt$
              desc: "the domain asks through a port (decision 17): use internal/template/port"
            - pkg: github.com/donvargax/itos-template/internal/adopt$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/check$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/cutrelease$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/newproject$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/syncbranch$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/update$
              desc: "the domain imports no slice (decision 17)"
            - pkg: github.com/donvargax/itos-template/internal/cli$
              desc: "the domain imports no UI (decision 17): internal/cli turns its errors into exit codes and lines"
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI (decision 17)"
        # The domain's own code does no I/O: no os (os/exec with it) and no
        # net. Its tests may read a fixture.
        domain-io:
          files:
            - "**/internal/adoption/**"
            - "**/internal/answer/**"
            - "**/internal/caseform/**"
            - "**/internal/manifest/**"
            - "**/internal/project/**"
            - "**/internal/releasing/**"
            - "**/internal/render/**"
            - "**/internal/syncing/**"
            - "**/internal/template/**"
            - "**/internal/updating/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "the domain does no I/O (decision 17): reach the outside through a port of internal/template/port"
            - pkg: net
              desc: "the domain does no I/O (decision 17): reach the outside through a port of internal/template/port"
            - pkg: syscall
              desc: "the domain does no I/O (decision 17): reach the outside through a port of internal/template/port"
            - pkg: log
              desc: "the domain does no I/O (decision 17): its errors say what happened, and the UI and infra log"
            # path/filepath writes a path as the OS it was built for does,
            # so a domain using it differs by OS with no value saying which
            # (decision 26): the domain writes paths with path, / alone, or
            # takes a template.System. runtime is refused so that the edge
            # forbidigo allows, template.SystemOf(runtime.GOOS), is never in
            # the domain.
            - pkg: path/filepath
              desc: "code that differs by OS takes the OS as a value (decision 26): use path, or take a template.System"
            - pkg: runtime$
              desc: "code that differs by OS takes the OS as a value (decision 26): take a template.System, which the slices make at the edge"
        # Infra implements the ports and imports nothing of ours but them:
        # turning the outside's terms into the ports' is its anti-corruption
        # layer, kept there.
        infra:
          list-mode: lax
          files:
            - "**/internal/disk/**"
            - "**/internal/git/**"
            - "**/internal/program/**"
            - "**/internal/prompt/**"
            - "**/internal/tempdir/**"
          allow:
            - github.com/donvargax/itos-template/internal/template/port$
          deny:
            - pkg: github.com/donvargax/itos-template
              desc: "infra imports nothing of ours but the ports it implements (decision 17)"
        # Tests use our own fakes and stubs, never mocks, which script and
        # check calls (decision 19): no mocking library comes in, in any
        # package or test.
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: go.uber.org/mock
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: github.com/stretchr/testify/mock
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: github.com/vektra/mockery
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "never mocks (decision 19): a fake or a stub of the port, in its porttest"
        # Libraries the decisions weighed and set aside: none comes in, in
        # any package or test, until its decision is revisited.
        set-aside:
          files:
            - $all
          deny:
            - pkg: github.com/spf13/cobra
              desc: "kong declares the command line (decision 4)"
            - pkg: github.com/urfave/cli
              desc: "kong declares the command line (decision 4)"
            - pkg: github.com/go-git/go-git
              desc: "go-git merges only by fast-forward (decisions 19, 38): git's own command line, through a port"
            - pkg: github.com/leanovate/gopter
              desc: "properties are rapid's (decision 20)"
            - pkg: testing/quick
              desc: "properties are rapid's (decision 20): testing/quick is frozen and does not shrink"
            - pkg: github.com/zricethezav/gitleaks
              desc: "a template's own checks run gitleaks, pinned, never a library inside check (decision 21)"
            - pkg: github.com/gitleaks/gitleaks
              desc: "a template's own checks run gitleaks, pinned, never a library inside check (decision 21)"
            - pkg: github.com/posener/complete
              desc: "shell completion is our own __complete (decision 25)"
            - pkg: github.com/willabides/kongplete
              desc: "shell completion is our own __complete (decision 25)"
            - pkg: github.com/jotaen/kong-completion
              desc: "shell completion is our own __complete (decision 25)"
        # Properties are unit tests of the domain (decision 20): rapid comes
        # in only in the domain packages' own tests, never in their code, in
        # porttest, or anywhere else. Each domain package is listed, as under
        # domain above.
        rapid:
          files:
            - $all
            - "!**/internal/adoption/*_test.go"
            - "!**/internal/answer/*_test.go"
            - "!**/internal/caseform/*_test.go"
            - "!**/internal/manifest/*_test.go"
            - "!**/internal/project/*_test.go"
            - "!**/internal/releasing/*_test.go"
            - "!**/internal/render/*_test.go"
            - "!**/internal/syncing/*_test.go"
            - "!**/internal/template/*_test.go"
            - "!**/internal/updating/*_test.go"
          deny:
            - pkg: pgregory.net/rapid
              desc: "properties are unit tests of the domain (decision 20): rapid only in the domain packages' _test.go files"
        # kong is the UI's: cmd, internal/cli and the slices.
        kong:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/cli/**"
            - "!**/internal/adopt/**"
            - "!**/internal/check/**"
            - "!**/internal/cutrelease/**"
            - "!**/internal/newproject/**"
            - "!**/internal/syncbranch/**"
            - "!**/internal/update/**"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI (decision 17): cmd, internal/cli and the slices"
  exclusions:
    rules:
      # Test code is left out of gosec: it writes fixtures and runs programs
      # where the test says, in folders the test made. The _test.go files,
      # the scenarios in features/, and the packages that only tests import
      # (releasetest, porttest).
      - path: _test\.go$
        linters: [gosec]
      - path: ^features/
        linters: [gosec]
      - path: ^internal/release/releasetest/
        linters: [gosec]
      - path: ^internal/template/port/porttest/
        linters: [gosec]
      # Decision 26's edge: the slices hand the OS in as a value,
      # template.SystemOf(runtime.GOOS), the one read of it allowed. A new
      # edge is added here by name, so each is a reviewed change.
      - linters: [forbidigo]
        text: runtime\.GOOS
        source: \bSystemOf\(runtime\.GOOS\)
      # Decision 26's edge in internal/git, infra, which cannot import
      # template: Bin hands the OS to bin as a value, bin(runtime.GOOS), the
      # one read of it there, which names and executable take (T-48).
      - path: ^internal/git/git\.go$
        linters: [forbidigo]
        text: runtime\.GOOS
        source: \bbin\(runtime\.GOOS\)
      # Tests ask which OS they run on: a test of the real OS, an adapter's
      # or a scenario's step, skips or expects what that OS does, and the
      # code proof decision 26 serves mutates no test. They read what the
      # binary wrote with yaml.v3 as it is, the strict reader being for the
      # input a template brings (decision 22). They exit: TestMain's
      # os.Exit(m.Run()) and a helper process exiting with a code, as
      # internal/git's stub git does, are standard Go, and decision 17's
      # main-alone rule holds production code, still held (T-48). A test
      # may panic, as a failure of its own: rule 31's exit codes are the
      # binary's (T-52).
      - path: _test\.go$
        linters: [forbidigo]
        text: runtime\.GOOS|yaml\.(Unmarshal|NewDecoder)|(os|syscall)\.Exit|panic
      # main exits with the code the slice returned (decision 17).
      - path: ^cmd/itos-template/main\.go$
        linters: [forbidigo]
        text: os\.Exit
      # tools/bin's programs are the repository's own scripts, each a main
      # writing to its stdout and exiting with its code, outside the layers
      # decision 17 draws for itos-template.
      - path: ^tools/bin/
        linters: [forbidigo]
        text: os\.Exit|fmt\.Print
      # The strict reader itself (decision 22).
      - path: ^internal/manifest/decode\.go$
        linters: [forbidigo]
        text: yaml\.NewDecoder
formatters:
  enable:
    - gofmt
