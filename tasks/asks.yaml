# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    question: "How does a template hold the parts a project fills in, given that Jinja2 and Go templates make the template something that neither builds nor tests?"
    answer: "No template language. The template is a real, working project using distinctive literal values (a name, a module path, a type); a manifest maps each literal to a question, and rendering rewrites the answers into file contents and names with their case forms, reading no language's syntax, so it works for any stack. Prior art: dotnet new and gonew, each tied to its stack. The user's calls, 2026-10-06."
    decision: 1
  - id: q-2
    question: "How are the optional parts of a template (a stack, a feature, a provider) chosen when a project is made?"
    answer: "As git branches, never as conditionals in the files: a root branch with what every stack shares, a branch per stack off it, a branch per feature off its stack, a feature needing another branched off that one (TopGit's topic branches are the prior art). Rendering merges the stack and the chosen features, then substitutes the literals last. The root is merged down, never rebased; a template release is a tag. Providers are chosen this way at generation time, never by runtime indirection. The user's calls, 2026-10-06."
    decision: 2
  - id: q-3
    question: "How does a project made from the template take a newer template release?"
    answer: "As copier and cruft do: the project records the tag, the stack, the features and the answers; an update renders the old tag and the new one with the same answers and merges their difference into the project, the old render the base of a 3-way merge, landing as an ordinary commit through the project's gates. The user's call, 2026-10-06."
    decision: 3
  - id: q-4
    question: "What is itos-template built with and how is it started?"
    answer: "Go, kong for commands and flags (a --no- pair per switch, an environment variable per flag), an itos extension (itos template) that also runs alone, under the AGPL-3.0 as itos is, held to itos from its first commit. Its infrastructure (CI on three platforms, releases cut by CI, the godog harness, the CLI rules) is harvested from itos, not rewritten; its own skeleton, domain stripped, becomes the first template's stack/go and go/cli branches. CLI projects come first. The user's calls, 2026-10-06."
    decision: 4
  - id: q-5
    question: "How does a project made from the template get its pre-commit hook, beside itos's commit-msg and pre-push, without fighting the hook tool its stack's ecosystem already has (vite-plus's .vite-hooks, say)?"
    answer: "The pre-commit hook is the stack's, in the stack's own tool: a vite-plus stack's is .vite-hooks with vp staged, which its package manager's install sets up; a Go stack, whose ecosystem has none, declares a POSIX sh script (tools/hooks/pre-commit) in the git config, as itos declares its own, git running it under Git for Windows' sh on Windows. itos's hooks stay in the git config beside it and itos owns no pre-commit (its decision 37); the root branch carries none. itos-template new sets the hooks up when it makes a project, so no project carries a setup tool of its own. Neither lefthook nor pre-commit: each is a second install step and a tool to pin, and pre-commit brings Python to every stack. The user's calls, 2026-10-06."
    decision: 5
  - id: q-6
    item: "new-hooks"
    question: "new sets up the hooks of the project it makes, but a later clone of that project (another person, a new machine) was never made by new: how does it get its hooks? Recommended: one itos-template command any clone runs (itos template hooks, say), declaring itos's hooks and the stack's from what new recorded, the same code new runs. Or: the README's lines by hand, CI holding the checks for a clone that skips them."
    answer: "itos template hooks, which a clone runs, declares only the hooks its stack's manifest names, for a stack whose ecosystem has no hook tool of its own: in practice the Go stack's tools/hooks/pre-commit. It never declares itos's hooks, which itos hook install does. A stack with its own mechanism (vite-plus's .vite-hooks, set up by its package manager's install) names none, and the command does nothing there. It is the code new runs to declare the same hooks; simple to add and to maintain. The README's lines by hand are not the way. The user's calls, 2026-10-06."
    decision: 6
  - id: q-7
    item: "new-setup"
    question: "Should the generator know itos and the stacks' hook tools (decisions 5 and 6), or should the template drive what a made project needs set up?"
    answer: "The template drives it; the generator knows no itos and no stack's hook tool. The manifest lists setup steps per branch: the root of a template using itos lists itos hook install, stack/go its git config lines for tools/hooks/pre-commit, a vite-plus stack none (its package install sets its hooks up), a template without itos nothing of it. new runs the chosen branches' steps after rendering; itos template setup, the same code, runs them in a clone new did not make. Steps are a template's code, so, as copier's --trust, new shows them and asks on a terminal, or runs them under --trust, never silently. itos-template stays an itos extension (decision 4): that is how it is installed and called, not what it knows. The user's calls, 2026-10-06."
    decision: 7
  - id: q-8
    item: "new-renders"
    question: "Where does a template's manifest live, and in what format? Recommended: one YAML file, itos-template.yaml, at the top of the root branch, merged down into every stack and feature with the rest of the root, so each branch carries the same manifest and stays a real project. It lists the branches (each stack, each feature with its stack and the features it needs), the questions (each literal, its question, a default, a pattern its answer must match), and per branch its setup steps (decision 7) and later its checks (for check). It also lists the paths only the template keeps (its own CI that renders every combination, say); the manifest itself is always left out of a render. Or: a manifest per branch, each holding that branch's part, merged when a project is made (it reads close to the branch it describes, but the merge of manifests is a second merge to get right); or TOML or JSON instead of YAML (YAML is what itos and the CI already use)."
    answer: "One YAML file, itos-template.yaml, at the top of the root branch, merged down into every stack and feature with the rest of the root, so each branch carries the same manifest and stays a real project. It lists the branches (each stack, each feature with its stack and the features it needs), the questions (each literal, its question, a default, a pattern its answer must match), per branch its setup steps (decision 7) and later its checks, and the paths only the template keeps; the manifest itself is always left out of a render. The user's call, 2026-10-06."
    decision: 8
  - id: q-9
    item: "new-renders"
    question: "How is a template named to new? Recommended: anything git clone takes, a local path included (git clones a path as it does a URL), fetched by git itself, so private templates use git's own credentials and none pass through itos-template; --ref picks a tag or a commit, by default the newest release, else the root branch's head. Or: a git URL plus a shorthand such as gh:owner/repo (shorter, but a host baked into the generator, against PLAN.md's standard-protocols principle); or local paths only to start (simplest, but the first real use is a template on GitHub)."
    answer: "Anything git clone takes, a local path included, fetched by git itself, so private templates use git's own credentials and none pass through itos-template; --ref picks a tag or a commit, by default the newest release, else the root branch's head. The user's call, 2026-10-06."
    decision: 9
  - id: q-10
    item: "new-renders"
    question: "What does a made project record of its render, and where? Recommended: one committed file at its top, .itos-template.yaml, as copier's .copier-answers.yml: the template as it was named, the release it was made from when there was one, the stack, the features, the answers, and the commit each branch was rendered from. The commits make the old render reproducible for update even without tags, so new-renders needs no answer yet on how a release is tagged across branches. No answer is ever a credential (PLAN.md), so the file is safe to commit. Or: a folder, .itos-template/, holding the record and later state (room to grow, more to explain); or git notes on the first commit (nothing in the tree, but lost on a clone that fetches no notes)."
    answer: "One committed file at the made project's top, .itos-template.yaml, as copier's .copier-answers.yml: the template as it was named, the release it was made from when there was one, the stack, the features, the answers, and the commit each branch was rendered from, so update can reproduce the old render even without tags. No answer is ever a credential (PLAN.md), so the file is safe to commit. The user's call, 2026-10-06."
    decision: 10
  - id: q-11
    item: "new-renders"
    question: "What does new do when an answer is not given with --answer? Recommended: on a terminal it asks, showing the default, and checks the answer against the question's pattern, asking again on a mismatch; without a terminal it refuses with exit 2 before writing anything, naming every missing answer at once, unless --defaults takes each missing one's default (a question with no default still refused). Or: without a terminal, take the defaults silently (convenient in scripts, but a project made with values nobody chose); or never ask, every answer by flag (simplest to test, but unfriendly for a person)."
    answer: "On a terminal new asks, showing the default, and checks the answer against the question's pattern, asking again on a mismatch; without a terminal it refuses with exit 2 before writing anything, naming every missing answer at once, unless --defaults takes each missing one's default, a question with no default still refused. The user's call, 2026-10-06."
    decision: 11
  - id: q-12
    item: "new-renders"
    question: "Where does new write the project? Recommended: into a folder that does not exist or is empty, which it makes a git repository with the render as its first commit, so update has a base to merge onto from day one; a folder with files in it is refused, exit 1, naming it. Or: render into any folder and leave committing to the person (copier's way; works over an existing project, but update then has no known base); or render without git and let setup steps init it (decision 7; leaves the most to each template)."
    answer: "Into a folder that does not exist or is empty, which new makes a git repository with the render as its first commit, so update has a base to merge onto from day one; a folder with files in it is refused, exit 1, naming it. The user's call, 2026-10-06."
    decision: 12
  - id: q-13
    question: "Before writing code for a problem a library likely already solves (merging, case conversion, YAML, terminal prompts, archives), do we look for one first, and how do we choose between using it and building it ourselves?"
    answer: "Yes, for a problem a library likely already solves, not for all code: look for an existing library first and weigh it against building it. The weighing: how active it is (releases, maintainers, open issues answered), how complex it is beside how complex the problem is, how likely we are to need to change it, and the value it gives against what building and keeping our own costs. Safe to use means a licence the AGPL-3.0 can take, no known vulnerability (govulncheck), and pinned and checked as every dependency is. There is no right or wrong answer, so the choice is never an agent's alone: the coordinator weighs the candidates with the user, and the user and the coordinator review it together. It is settled while the item is specified, so it is in the spec before the agent starts; an agent that meets such a problem unforeseen stops and proposes the candidates rather than choosing. The choice and why go in the spec and in the commit body that adds the library or the code instead. The user's calls, 2026-10-06; the safety terms are the coordinator's reading of safe, the user free to change them."
    decision: 13
  - id: q-14
    item: "slice-2"
    question: "Which combinations does itos-template check render, and which does new offer? Recommended: derived, every combination the stacks, features and needs allow, less those the manifest lists as unsupported, which check skips and new refuses. Or: listed explicitly, check rendering exactly the listed ones and new refusing any other (a fixed count, but a list to keep up to date)."
    answer: "Derived, less those the manifest lists as unsupported. The user's call, 2026-10-07, knowing each feature that needs no other doubles a stack's combinations."
    decision: 14
