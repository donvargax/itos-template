# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    question: "How does a template hold the parts a project fills in, given that Jinja2 and Go templates make the template something that neither builds nor tests?"
    answer: "No template language. The template is a real, working project using distinctive literal values (a name, a module path, a type); a manifest maps each literal to a question, and rendering rewrites the answers into file contents and names with their case forms, reading no language's syntax, so it works for any stack. Prior art: dotnet new and gonew, each tied to its stack. The user's calls, 2026-10-06."
    decision: 1
  - id: q-2
    question: "How are the optional parts of a template (a stack, a feature, a provider) chosen when a project is made?"
    answer: "As git branches, never as conditionals in the files: a root branch with what every stack shares, a branch per stack off it, a branch per feature off its stack, a feature needing another branched off that one (TopGit's topic branches are the prior art). Rendering merges the stack and the chosen features, then substitutes the literals last. The root is merged down, never rebased; a template release is a tag. Providers are chosen this way at generation time, never by runtime indirection. The user's calls, 2026-10-06."
    decision: 2
  - id: q-3
    question: "How does a project made from the template take a newer template release?"
    answer: "As copier and cruft do: the project records the tag, the stack, the features and the answers; an update renders the old tag and the new one with the same answers and merges their difference into the project, the old render the base of a 3-way merge, landing as an ordinary commit through the project's gates. The user's call, 2026-10-06."
    decision: 3
  - id: q-4
    question: "What is itos-template built with and how is it started?"
    answer: "Go, kong for commands and flags (a --no- pair per switch, an environment variable per flag), an itos extension (itos template) that also runs alone, under the AGPL-3.0 as itos is, held to itos from its first commit. Its infrastructure (CI on three platforms, releases cut by CI, the godog harness, the CLI rules) is harvested from itos, not rewritten; its own skeleton, domain stripped, becomes the first template's stack/go and go/cli branches. CLI projects come first. The user's calls, 2026-10-06."
