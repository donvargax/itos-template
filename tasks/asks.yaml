    item: "slice-2"
    question: "How does the manifest write a check command? Recommended: a list of words run with no shell, the same on Linux, macOS and Windows, a template wanting a shell writing sh -c itself. Or: a shell line run by sh -c (cmd on Windows), easier to write but meaning different things per platform."
    answer: "A list of words run with no shell. The user's call, 2026-10-07."
    decision: 15
  - id: q-16
    question: "How is the code put together? Recommended: domain-driven design in vertical slices. Each command (new, check, later update and sync) is a slice, one package and one file holding its kong command, its use case, its output and the I/O only it needs, split into more files only when large or complex; slices never import each other. What slices share is the domain model in the ubiquitous language (manifest, stack, feature, combination, question, answer, literal, case form, render, record), in packages named for what they model, and the adapters several use (git, temporary folders, the terminal). No mappers: the kong command is the slice input, and domain types are read and written as the user sees them (the manifest, the record, the report, --json); an anti-corruption layer only where an outside model would leak in (git output, a scanner findings). Or: layers as folders (domain, app, infra) with mappers at their edges."
    answer: "Domain-driven design in vertical slices, each in one file until it grows large or complex; no mappers, the domain exposed to the user unless something requires an anti-corruption layer. A gate holds the slices apart: golangci-lint depguard refuses a slice importing another, dropped if it gets in the way too often. The user's call, 2026-10-07."
    decision: 16
  - id: q-17
    question: "Within the vertical slices, how are the layers held apart, and where do errors become exit codes? Recommended: DDD with thin UI and application layers. A slice is one directory (one file until it grows): its kong struct and Run (the UI) and its CQRS command or query with its handler (the application), the handler only wiring. The shared domain does the work, reaching git and files only through interfaces (ports) in port subpackages; infra implements those ports and imports nothing else of ours. Commands carry domain objects; the only copy left is Run assembling a command from kong flags. The domain errors are sealed sets of plain domain types with no exit code; the UI alone turns them into exit codes, gochecksumtype refusing a switch that leaves one out. depguard holds every arrow. Or: decision 16 as T-8 built it, exit codes set where an error is made, the domain driving no ports."
    answer: "DDD in vertical slices with thin UI and application layers, the work in the domain. A slice is one directory, one file until it grows: its kong struct and Run (UI) and its CQRS command or query and handler (application); kong stays in the UI. The shared domain reaches the outside only through ports in port subpackages; infra implements only those, importing nothing else of ours. Commands carry domain objects; Run assembling a command from kong flags is the one copy left, accepted as kong's cost. Domain errors are part of the domain, sealed sets of domain types with no UI concern; the UI turns them and infra's into exit codes, held by gochecksumtype; only an error nobody classified, a bug, exits 70. The user's call, 2026-10-07."
    decision: 17
  - id: q-18
    question: "How is the code tested across its layers? Recommended: the domain unit-tested in full, its ports faked; the UI, the application and infra held by the scenarios (godog against the built binary, on Linux, macOS and Windows); a test outside the domain only for what a scenario cannot reach (asking on a terminal, removing a folder on Windows), its comment saying which. No integration-test layer. Or: unit tests in every package; or an integration layer for infra against the real git."
    answer: "The domain unit-tested in full with fakes of its ports; everything else held by the scenarios; a test outside the domain only where a scenario cannot reach, saying so. No integration-test layer: the scenarios already run the real git on three systems. The user's call, 2026-10-07."
    decision: 18
  - id: q-19
    question: "What stands in for git and the files in tests, and is any integration test needed? Recommended: the domain unit-tested in full with our own fakes (working in-memory implementations of its ports) and stubs (fixed results, such as a merge conflict), never mocks, tests asserting outcomes and never calls; everything else against the real git through the scenarios; no contract or integration test until a trigger calls for one. Or: go-git with in-memory storage as a fuller stand-in for git, with a contract suite run against it and against the real git; or unit tests in every package."
    answer: "Our own fakes and stubs in the domain's unit tests, never mocks, asserting outcomes and never calls; the real git everywhere else, through the scenarios. go-git was set aside: it merges only by fast-forward, so it could not stand in for the merges rendering and update need. No contract test now: the scenarios run every real path against the real git on three systems in seconds, so a fake that drifts from git is caught there. The user's call, 2026-10-07."
    decision: 19
  - id: q-20
    question: "Does the domain get property-based tests, and with what? Recommended: pgregory.net/rapid (v1.3.0, March 2026, modelled on Hypothesis, no dependencies of its own, in tests only): properties of the domain's functions (round-trips, determinism, invariants of derived values) with generators and shrinking, and stateful (model-based) tests through t.Repeat for operations that run in sequence, such as update and sync; the count of random cases per property set by RAPID_CHECKS, low on every push and high in a nightly run; rapid.MakeFuzz pointing Go's fuzzer at the parsers. Or: Go's built-in fuzzing alone (basic types only, no structured inputs); gopter (last released April 2024); testing/quick (frozen, no shrinking)."
    answer: "rapid, for properties of inputs and for stateful tests of the system. One random case per property on every push, so the property tests stay as fast as unit tests while each push tries a new case; many in the nightly run. The user's call, 2026-10-07."
    decision: 20
  - id: q-21
    item: "template-scans"
    question: "How does a template's check find leaked credentials in its renders? Recommended: the template's own checks run gitleaks, pinned and checksummed as tools/bin/pinned pins golangci-lint, on every render, so itos-template takes no dependency and the check mechanism of slice-2 does the work; itos-template check builds the leftover-literal scan itself and warns when a template's checks name no credential scan. Or: gitleaks as a Go library inside check (always runs, a heavy dependency tree in the binary); or our own small set of patterns (light, far weaker than gitleaks' rules and harder to keep current)."
    answer: "The template's own checks run gitleaks, pinned; check scans for leftover literals itself and warns when a template's checks name no credential scan. The user's call, 2026-10-07."
    decision: 21
  - id: q-22
    question: "How are configuration formats designed, the manifest and the record among them? Recommended: convention over configuration made visible (defaults written down and printable) and explicit over implicit; JSON as the data model and YAML as its syntax in one .yaml file, so a tool may write JSON there; a strict reader refusing what JSON cannot say (custom tags, several documents, anchors, aliases, merge keys, non-string keys, duplicate keys), since a tag can build any object, an alias can expand without bound, and a manifest comes from any template git can clone; no language of our own, a configuration language writing JSON on the author's side meeting repetition; rules gathered in docs/CONFIG.md from the Kubernetes API conventions, Google's AIPs, CLIG, JSON and YAML 1.2, and JSON Schema. Or: allow anchors and aliases with expansion limits, to spare repetition."
