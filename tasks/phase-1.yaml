  done_when:
    - run: "! grep -rn 'Which stack' internal/template internal/answer internal/manifest"
    - run: go build ./...
- id: T-18
  type: build
  title: "itos 7.0.0-rc.1: the pin and CI's itos action move from 6.4.0"
  why: >
    The person's call, 2026-10-08: try itos's first support for itos-cc before the first template.
