  done_when:
    - run: "grep -q 'version: \"7.0.0-rc.1\"' itos.yaml"
    - run: "grep -q 'donvargax/itos@1b9f1f9995be5d20aed3b4f8877a453bbd1e98a3 # v7.0.0-rc.1' .github/workflows/ci.yml"
    - run: "grep -q 'donvargax/itos@1b9f1f9995be5d20aed3b4f8877a453bbd1e98a3 # v7.0.0-rc.1' .github/workflows/release.yml"
    - run: itos version --check
- id: T-19
  type: test
  title: The features build the itos-template under test with -cover when GOCOVERDIR is set, so itos-cc sees what the scenarios run
  why: >
    For T-20's code proof (the person's call, 2026-10-08: a gate from the start). The scenarios run
    the built itos-template as another process, so Go records their coverage only for a binary built
    with -cover writing to GOCOVERDIR (go.dev/doc/build-cover); without it they add 0.0%, and
    itos-cc called all of slice-7's checkout.go and check.go uncovered (23 mutants). Tried on
    2026-10-08 in a scratch worktree: building with -cover -covermode=atomic -coverpkg=./... when
    GOCOVERDIR is set let itos-cc mutation run --all-tests kill 13 of them, the scenarios' coverage
    merged with go test's; w.env() already passes GOCOVERDIR to every command a scenario runs. The
    trap: a -cover binary with no GOCOVERDIR writes a warning to stderr, which broke @ID-CHECK-13
    (no warning); itos-cc's listed tests set only ITOS_CC_TEST_COVERDIR for their first coverage
    run, so the build keys on GOCOVERDIR alone, never on that variable. Splitting the coverage per
    scenario under ITOS_CC_TEST_COVERDIR, as itos's T-121 does, is not needed while --all-tests is
    cheap (the idea listed-tests). Without GOCOVERDIR nothing changes. As itos's T-121 does it
    (6377a0d, df80cd9 in donvargax/itos).
  done_when:
    - run: d=$(mktemp -d) && GOCOVERDIR=$d go test ./features -count=1 -scenarios='^@ID-CHECK-15$' && go tool covdata func -i="$d" | awk '$1 ~ /internal\/git\/checkout\.go/ && $2 == "CloneHere" && $3 != "0.0%" {f=1} END {exit !f}'
    - run: ITOS_CC_TEST_COVERDIR=$(mktemp -d) go test ./features -count=1 -scenarios='^@ID-CHECK-13$'
- id: T-20
  type: build
  title: "work done requires the code proof through itos-cc, with the scenarios' coverage, and CI samples it"
  why: >
    Was the idea itos-cc-gates (docs/template-contents.md, Code quality). The person's calls,
    2026-10-08: a gate from the start, not advice first; itos-cc pinned now, the 7-day age
    tools/bin/pinned asks of a version not applying to the owner's own tools (itos, itos-cc), as
    itos 6.4.0 was pinned here the day it was out. itos 7.0.0-rc.1 (T-18) reads proof.code: work
    done closes an item whose commits touch its paths only once its check exits 0. tools/bin/pinned
    gains itos-cc v0.5.0, its five archives' hashes from the release's checksums.txt, and its
    comment says the age rule is for others' tools. itos.yaml gains proof.code, paths
    "{cmd,internal}/**/*.go", check "tools/bin/pinned itos-cc mutation check --since {base}
    --fail-uncovered --json". Results are recorded with --all-tests, every scenario run for each
    mutant: the whole suite takes about 4 seconds, and with T-19's cover build its coverage reaches
    itos-cc (tried 2026-10-08: 38 seconds for slice-7's 23 mutants, against 57 with listed tests,
    the idea listed-tests). Runs pass --no-annotate, so no summary comment changes a source file;
    .metrics/mutate/ is committed with the code, as itos-cc means it (.metrics/coverage/ ignores
    itself). CI's plan gains a late step, tools/bin/pinned itos-cc mutation sample with a small
    --count, so a cache written by hand or against other code fails. AGENTS.md's Finishing says
    an implementing session runs tools/bin/pinned itos-cc mutation run --since <the parent of its
    item's first commit> --fail-uncovered --all-tests --no-annotate, commits .metrics/mutate/, and
    kills or excepts (with a reason, for the person to review) what survives before work done. Only
    changed functions are judged, so code already here costs nothing until an item touches it:
