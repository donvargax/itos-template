- id: T-25
  type: build
  title: "Bootstrap the first template's language-neutral root repository"
  why: >
    First-template's dependencies are done. The person approved the public repository
    donvargax/go-template-itos (q-34) and MIT distribution of their own harvested
    infrastructure, preserving third-party licenses and provenance (q-35). This is the
    first of four pieces: root, stack/go, go/cli, then template check CI. It changes no
    generator behavior. Bootstrap the existing empty repository with main as its
    root/default branch, without a Go module or generator code. Harvest .gitattributes,
    common .gitignore entries, tools/bin/doc-caps, the pinned itos/range/verification
    parts of .github/workflows/ci.yml, and the owner's base Renovate preset from this
    repository. Write fresh itos data, not this project's work history. Start a target
    bootstrap task T-1 and registry; take, commit and close it through itos. Its checks
    must also hold in a made project, where the manifest itself is excluded. Root CI
    checks configuration and doc caps and verifies commit rules; it does not pretend
    to run Go, domain coverage, scenarios, mutation or binary releases without their
    code. Defer sourced Scenarios footers until a runnable test kind exists. Later
    pieces install the complete corresponding gates, not permanent weaker versions.
    Root workflow triggers main, stack/**, go/** and renovate/**, so each later branch
    is checked with its own tree. No release job at root. Keep tools and presets' real
    upstream identities; substitute only project identity, never every donvargax.
    Use the root docs authored by the coordinator, in separate docs commits. The root
    CONTRIBUTORS.md includes the coordinator-corrected All Contributors profile table
    with donvargax's real GitHub profile: narrative provenance alone does not register
    a work owner. Preserve that provenance while making the owner resolvable by itos.
    README says unfinished, not that it already counts or scans. Add a fresh MIT
    LICENSE with itos-corp as the illustrative attribution owner. The manifest is
    version 4, names stack go and its cli feature, and asks for name (go-template-itos,
    case forms), owner (itos-corp, exact) and module
    (github.com/itos-corp/go-template-itos, exact), without guessed answers or defaults.
    Its first_commit was a chore message naming target T-1; T-28 drops that footer, because a
    made project has no ledger at its first commit and T-1 there means Adopt itos. Both go and go + cli are planned;
    missing branches mean this intermediate template is not ready to render. Do not
    run check yet or claim credentials scanning; the fourth piece installs pinned
    gitleaks and scans: [credentials]. Preserve owner MIT permission/provenance in
    target docs. No existing source mutation records or generator fixtures are copied.
    Close only after target main's exact pushed head CI is green and source checks
    pass. Read branch status from GitHub, not an agent report. The source task's checks
    inspect the public root and must pass before its implementation/evidence commit
    names T-25 and is pushed. Source changes are registry, ledger and coordination
    docs only; the implementation belongs to the template repository.
  done_when:
    - run: >-
        d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT &&
        git clone --quiet --depth 1 --branch main https://github.com/donvargax/go-template-itos.git "$d" &&
        cd "$d" && itos config check && tools/bin/doc-caps &&
        test -f LICENSE && grep -q 'MIT License' LICENSE &&
        test -f itos-template.yaml && test -f .github/workflows/ci.yml &&
        test -f .github/renovate.json5 && test ! -f go.mod &&
        test ! -d cmd && test ! -d internal
- id: T-26
  type: build
  title: "Add the first template's working Go foundation and full code gates"
  why: >
    Second piece of first-template, after T-25. In go-template-itos, branch stack/go
    from the current root main without rewriting history. Bootstrap a real, testable
    Go module github.com/itos-corp/go-template-itos, not an empty skeleton that avoids
    measurable code. The private example's counting domain, Files port, disk adapter,
    in-memory fake, example tests and rapid property belong here; go/cli adds the
    public command and thin application/UI later. The counting policy was delegated
    to the coordinator by the person (q-36, q-37). Count logical lines: empty input
    gives zero, LF separates lines, CRLF is one separator, and a nonempty final line
    without LF counts. Words are non-whitespace runs under Go's Unicode-whitespace
    standard-library tokenization; punctuation stays within words. Use the standard
    library, not another dependency or a custom word parser. Treat invalid UTF-8 bytes
    as non-whitespace as that tokenizer does; no encoding guessing or conversion.
    Do not impose Scanner's default token limit on a long line. File input is read-only;
    missing/unreadable inputs are typed failures through the Files port, not raw OS
    models leaking into the domain. There are no UI flags, JSON or exit codes here.
    The additive property joins newline-terminated pieces so counts add across valid
    line and word boundaries; arbitrary concatenation is not promised additive.
    Unit tests assert outcomes through our in-memory fake, never mocks. Disk boundary
    tests may use real temporary files and pure error classification tests, without
    assuming Unix permission bits work on Windows. Knowledge that differs by OS takes
    the OS as a value, with only unavailable calls build-tagged (decision 26).
    Harvest this project's go.mod/go.sum as version references, not a dependency list
    to retain blindly; keep Go 1.27.2's security patch and only actual imports/tools.
    Retain rapid at the source pin; kong and godog arrive with their actual CLI imports.
    Harvest .golangci.yml, tools/bin/pinned, tools/bin/domain-coverage and the Go
    pre-commit hook, retargeting package rules and keeping no generator-specific
    exceptions. Domain coverage is 80 percent and judges the actual counting package.
    Add full proof.code with the first Go code and fresh committed mutation evidence,
    fail-uncovered and all-tests, killing survivors rather than reshaping code to avoid
    sites. No source project's cache is copied. Determine the base from this target
    item's actual first commit, specs included, never assume the take commit is first.
    Root checks remain; the Go CI plan adds formatting, vet, module verification,
    tidy-diff, pinned lint, govulncheck, tests, domain coverage and mutation sampling.
    Run tests on Linux, macOS and Windows with one rapid case per push. Add no phantom
    scenario kind or binary release job yet: neither public CLI nor its harness exists.
    Source donor patterns are internal/template/errors.go, its port/porttest fake,
    internal/disk/disk.go and internal/render/property_test.go, not their generator
    behavior. The root's Go Renovate preset/manager is added with the module. Use
    target checked tasks and commits; private bootstrap behavior is specified here
    before tests and code, with tests committed red first. Root/common manifest and
    coordinator docs evolve with what exists, without claiming the CLI/check piece.
    The go combination must remain independently buildable and testable. Close only
    after target stack/go's exact pushed head CI and target code proof are green, and
    source checks pass. Generated combination acceptance and gitleaks arrive in the
    final template-check piece; do not publish the unfinished template as ready yet.
  done_when:
    - run: >-
        d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT &&
        git clone --quiet --branch stack/go https://github.com/donvargax/go-template-itos.git "$d" &&
        cd "$d" && itos config check && tools/bin/doc-caps &&
        test -f go.mod && grep -qx 'module github.com/itos-corp/go-template-itos' go.mod &&
        grep -qx 'toolchain go1.27.2' go.mod &&
        test -f tools/bin/domain-coverage && test -f tools/bin/pinned &&
        go mod verify && go mod tidy -diff &&
        go test ./... && tools/bin/domain-coverage
- id: T-27
  type: build
  title: "Add the first template's CLI feature and proven command-line machinery"
  why: >
    Third piece of first-template, after T-26. In go-template-itos branch go/cli from
    the verified stack/go head without rewriting history. The source task coordinates
    an external bootstrap; target public behavior follows its own wip scenarios and
    feat commits, not a build label substituted for behavior. Keep the Go foundation
    and its proof/coverage gates whole. Add a thin application handler and kong UI
    whose command carries domain data and calls the counting domain through its Files
    port; no options/DTO struct copying a domain type and no counting in the UI.
    The command is count <file>, with - reading stdin, not an implicit default action.
    Count uses the foundation's logical lines and Unicode-whitespace words; a long
    line is not truncated by Scanner's default token limit. It writes no input or
    project files. Human success gives line and word counts on stdout and the
    use-json hint on stderr, never input contents. With --json success is one object
    with schema: 1, ok: true, file (the argument, - for stdin), lines and words.
    Usage failures exit 2 and JSON failures still emit one object with schema: 1,
    ok: false and problems with rule, message and fix. Missing file input exits 3
    with COUNT_INPUT_MISSING; other unreadable input, including a directory or failing
    stdin, exits 3 with COUNT_INPUT_UNREADABLE. Keep the sealed error-kind-to-exit
    switch in the UI, exhaustive, never codes in the domain. An unclassified bug is
    70, not a pass-through child status. There is no ordinary count refusal/exit 1.
    No-argument invocation and help print help on stdout with exit 0; missing count's
    file is usage 2. Explicit --help and --version are actions, not negatable switches.
    JSON is a negatable switch with GO_TEMPLATE_ITOS_JSON; the uppercase project
    literal must substitute with name's case forms. Flag validation and -- handling
    retain docs/CLI.md's rules. The public count's scenarios are coordinator-authored
    before the implementing agent starts; target scenarios for the inherited command
    line/completion are adapted from the proven source files without generator steps.
    Install runnable scenario-kind/footer/CI selection together, never a dangling kind;
    add representative smoke entries with each live feature. Run the built, stamped,
    cover-enabled binary through godog on Linux, macOS and Windows. Unit domain tests
    remain fake-backed. Infrastructure tests can fake a failing reader without mocks
    or platform-dependent unreadable permission assumptions.
    Harvest source cmd/itos-template main structure; internal/cli UI, flag parsing and
    four-shell completion; internal/version and tests; the scenario harness, quoted
    argument tests and real-git resolution, dropping rendering/update fixtures. New
    root command has count, version, completion and hidden __complete, not generator
    commands. Completion derives candidates from kong and handles no current word,
    file fallback and flag prefixes; all four scripts use the new binary name and
    preserve quoted arguments. No input value is treated as a global flag. Structured
    logs stay quiet below warnings, JSON off a terminal and text on one, without color.
    Harvest GoReleaser, reusable release workflow, release version/notes helpers and
    internal/release, retargeting the hard-coded binary path. Real repository context
    determines publishing identity; do not globally replace upstream donvargax names
    or publish to the illustrative module owner. These are made-project binary
    releases, not a template-tag protocol. In this template, go/cli CI must not invoke
    binary release on root main where no binary exists; a rendered project's main
    has the complete release plan. Preserve no generator-specific lint exceptions.
    Add actual kong/godog/terminal dependencies from source pins, tidy the lockfiles,
    and regenerate agent rules from actual config. Coordinator docs arrive as separate
    docs commits. Fresh mutation records cover changed and newly imported test paths;
    use the target items' actual first-commit parents and all-tests/fail-uncovered,
    killing survivors, never accepting uncovered sites or editing gates. Close the
    target checked bootstrap task and public slice only on exact-head green CI and
    actual proof. Source checks pass before an evidence commit names T-27. Record
    exact target head/CI; this source task changes no generator behavior. Template
    render-check CI and credential scanning are the last separate piece, not claimed
    installed by this task.
  done_when:
    - run: >-
        d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT &&
        git clone --quiet --branch go/cli https://github.com/donvargax/go-template-itos.git "$d" &&
        cd "$d" && itos config check && tools/bin/doc-caps &&
        test -f cmd/go-template-itos/main.go &&
        test -f .goreleaser.yaml && test -f .github/workflows/release.yml &&
        go mod verify && go mod tidy -diff &&
        itos tests smoke check scenario && go test ./... &&
        go run ./cmd/go-template-itos count README.md --json
        go run ./cmd/go-template-itos count README.md --json
- id: T-28
  type: build
  title: "Keep the template's itos data out of every render, and drop first_commit's footer"
  why: >
    ADR-0032, which supersedes the two records before it. The problem was one of exclusion, not
    of placement, and the fix is two lines of the manifest.

    Each branch already keeps its own config, ledger and registry, scoped to the work that
    happened on it: main holds T-1, stack/go adds T-2, go/cli adds T-3 and the count-cli slice,
    and no branch holds another's work. Nothing is duplicated that ought to be one thing, so no
    branch is added, nothing merges up into anything, and no CI plan moves. Every branch keeps
    the gates, the plan, the proof and the task checks it has today. Add to the manifest a
    template_only naming itos.yaml and tasks, which IsTemplateOnly already excludes from every
    render beside the manifest itself.

    Drop the Task footer from the manifest's first_commit. The render is committed before the
    made project has any ledger, so a footer there names nothing, and in a made project T-1 means
    Adopt itos rather than anything this repository decides. The made project's own setup comes
    from the template's declared setup steps per ADR-0031, which is a later piece.

    The checks prove the two facts a machine can judge and that the earlier records could not: a
    render of every combination the manifest allows carries none of the template's itos data, and
    the manifest names no task. Reaching the first means building the generator's check, so this
    item's own checks read the manifest and the branch layout, and check itself follows with
    first-template. Do not add a branch, and do not touch a CI plan.
  done_when:
    - run: >-
        d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT &&
        git clone --quiet https://github.com/donvargax/go-template-itos.git "$d" &&
        cd "$d" && m=itos-template.yaml &&
        grep -q '^template_only:' "$m" &&
        grep -qE '^  - itos\.yaml$' "$m" &&
        grep -qE '^  - tasks$' "$m" &&
        ! grep -q 'Task:' "$m" &&
        git rev-parse --verify origin/main >/dev/null &&
        git rev-parse --verify origin/stack/go >/dev/null &&
        git rev-parse --verify origin/go/cli >/dev/null
- id: T-30
  type: build
  title: "The template's manifest declares what every render must pass, so check proves something"
  why: >
    check runs and passes today and proves nothing: the template manifest names no checks, so
    each combination renders and has nothing to run, and the only output is the warning that no
    check scans for credentials. Declare checks beside what they check, per branch as
    docs/manifest.md says, so a combination runs the root then the stack then the features in
    order, and what each branch already runs in its CI is what its renders must pass. Pin
    gitleaks as the root check and mark it scans: [credentials]. No check may be an itos one:
    after T-28 a render carries none of the template's own data, so there would be nothing to
    read. The made project's own setup comes from the template's declared setup steps.

    This item is that the checks are declared and run, not that they all pass: the first run of
    check over the declared checks found a real defect, which is the item render-gofmt. T-31 is
    where every combination passing is claimed.
  done_when:
    - run: >-
        d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT &&
        m=$(mktemp) && git clone --quiet https://github.com/donvargax/go-template-itos.git "$d/t" &&
        cp "$d/t/itos-template.yaml" "$m" &&
        grep -q '^checks:' "$m" &&
        grep -q 'scans:' "$m" &&
        grep -q 'credentials' "$m" &&
        grep -qE '^  - name: go$' "$m" &&
        git -C "$d/t" show origin/stack/go:tools/bin/pinned | grep -q 'gitleaks' &&
        go build -o "$d/itos-template" ./cmd/itos-template &&
        a="--answer name=blue-fox --answer owner=acme --answer module=example.com/blue/fox" &&
        "$d/itos-template" check https://github.com/donvargax/go-template-itos.git $a > "$d/c.txt" 2>&1;
        ! grep -q warning "$d/c.txt" && grep -q 'passed:' "$d/c.txt"
- id: T-31
  type: build
  title: "Prove the first template end to end and say it is ready"
  why: >
    The umbrella first-template, promoted once its last piece had an item of its own. Three of
    its four pieces are done: the language-neutral root as T-25 and target T-1, the Go
    foundation as T-26 and target T-2, and the public CLI and its scenarios as T-27 and target
    T-3 with the count-cli slice. The fourth is T-30, the checks a render must pass, which is
    what makes check mean anything for this template. What is left here is the closing claim,
    which no earlier item makes because it was not true yet: that a project made from this
    template is a working project, and that the template may be advertised as ready.

    PLAN.md order of work 4 says the template is advertised as ready only after this passes, so
    this item is where that happens and nowhere else. Three things have to hold. The public
    template renders every combination its manifest allows and each render passes the checks the
    manifest names, with the credential scan marked so no warning is left. A project made from
    the public template builds, tests and runs its command, with none of the template's own itos
    data in it and a first commit naming no task. And the template's own documents stop claiming
    it is unfinished, because after this it is not: README's status, PLAN.md's order of work, and
    docs/security.md's sentence saying no render credential scan is installed.

    Do not re-render itos-container here and do not treat it as a deliverable; it was a working
    sample taken while the manifest was still incomplete. Prove against the public template, and
    let a person make a project when they want one.
  done_when:
    - run: >-
        d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT &&
        go build -o "$d/itos-template" ./cmd/itos-template &&
        t=https://github.com/donvargax/go-template-itos.git &&
        a="--answer name=blue-fox --answer owner=acme --answer module=example.com/blue/fox" &&
        "$d/itos-template" check $t $a > "$d/check.txt" 2>&1 &&
        ! grep -q warning "$d/check.txt" &&
        grep -q '2 of 2 combinations passed' "$d/check.txt" &&
        "$d/itos-template" new $t "$d/p" --stack go --feature cli $a &&
        test ! -e "$d/p/itos.yaml" && test ! -e "$d/p/tasks" &&
        git -C "$d/p" log --format=%B -1 | grep -q 'chore: start the generated project' &&
        ! git -C "$d/p" log --format=%B -1 | grep -q 'Task:' &&
        env -C "$d/p" go build ./... && env -C "$d/p" go vet ./... &&
        env -C "$d/p" go test ./... && env -C "$d/p" go run ./cmd/blue-fox count README.md --json
- id: T-32
  type: ci
  title: "CI refuses a tracked file holding a format character or a Unicode line separator"
  why: >
    setup-invisible's agent found that its edits had turned \uXXXX escapes in a Go raw string
    into the literal characters, and only Go's refusal of a byte order mark there exposed it: a
    U+202E or a U+200B would have compiled, putting Trojan Source (CVE-2021-42574) in our own code
    where a review sees nothing. Nothing refuses one today. The person's call, 2026-10-09, over
    golangci-lint's bidichk (Go files and bidi controls alone) and a Go check of our own: one
    static step, ! git grep -P -n -I '[\p{Cf}\p{Zl}\p{Zp}]', which names each file and line, in
    itos.yaml's ci.steps beside the other static checks and in the plan a docs-only push runs,
    since a feature file or a doc can carry one as well. A byte order mark is Cf and is refused
    anywhere, the start of a file too; none is tracked today. It needs git built with PCRE2, which
    the ubuntu ci job has. A fixture or a test that needs such a character writes it as an escape
    and builds it in code, as ID-NEW-49 and ID-NEW-50's steps do, so the gate never has to except
    a path. Regenerate AGENTS.md's rules block with itos init --agent-rules, and delete the lesson
    in docs/ORCHESTRATING.md whose exit this is, in the same push.
  done_when:
    - run: >-
        test "$(grep -c 'p{Cf}' itos.yaml)" -ge 2 &&
        grep -q 'p{Cf}' AGENTS.md &&
        ! grep -q 'An invisible character in a test is written as an escape' docs/ORCHESTRATING.md &&
        ! git grep -P -n -I '[\p{Cf}\p{Zl}\p{Zp}]'
- id: T-33
  type: ci
  title: "The invisible-character gate passes only when git grep finds nothing, never when it fails"
  why: >
    T-32's step, ! git grep -P -n -I '[\p{Cf}\p{Zl}\p{Zp}]', negates every non-zero exit, so an
    error of git grep's own reads as a pass: exit 128 from a git built without PCRE2, as some
    local clones are, or from a pattern broken by an edit. T-32's agent showed it, a pattern
    missing its ] passing green. git grep exits 0 on a match, 1 on none and above 1 on an error,
    so the step becomes git grep -P -n -I '[\p{Cf}\p{Zl}\p{Zp}]'; test $? -eq 1, in ci.steps and
    in the plan a docs-only push runs, passing on 1 alone. The coordinator's call, routine: the
    plan's own shell, one line, no tool. gofmt's step has the same shape and stays as it is here:
    go vet, after it, refuses the file gofmt cannot read. Regenerate AGENTS.md's rules block.
  done_when:
    - run: >-
        test "$(grep -c 'test $? -eq 1' itos.yaml)" -ge 2 &&
        ! grep -q "'! git grep -P" itos.yaml &&
        grep -q 'test $? -eq 1' AGENTS.md &&
        { git grep -P -n -I '[\p{Cf}\p{Zl}\p{Zp}]'; test $? -eq 1; } &&
        ! { git grep -P -n -I '[\p{Cf}' 2>/dev/null; test $? -eq 1; }
- id: T-34
  type: ci
  title: "Pin itos 7.0.0-rc.3, with the code proof judged as a step of every CI run"
  why: >
    Was proof-in-ci, whose why said to pin the release that carries it. The itos on the PATH is
    7.0.0-rc.3 and this repository pins rc.1, so every run prints that they differ. rc.3's one
    breaking change is the one asked for in donvargax/itos#28: the code proof runs as a step of a
    CI run and leaves itos work done. Pinning rc.3 without the step would drop the proof from
    every item that touches cmd or internal, which is weakening a gate, so the two land together:
    itos pin 7.0.0-rc.3 (the version and the checksum of its checksums.txt); the code proof a step
    of itos.yaml's plan as rc.3 declares one, its check still proof.code.check, judged on every
    push whose range touches proof.code.paths; and every donvargax/itos action in ci.yml and
    release.yml pinned to rc.3's commit, 415df6017f451beef8d6e12ea15e8b638f625f1a, with its tag
    in the comment. rc.3's action installs the launcher of the release its ref names, so the
    version: 6.0.0 lines go, and the idea launcher-version with them. Agents still run the
    mutation run and commit .metrics/mutate/ before their last push; what changes is who judges
    it, so AGENTS.md's Finishing section says CI judges the proof rather than work done, and its
    rules block is regenerated. Read rc.2's and rc.3's notes for anything else that changes what
    this repository runs, and itos#20's fix: if a release already pinned carries it, delete the
    lesson whose exit it is in the same push. Prove the proof step can fail: on a scratch branch
    never pushed, a range holding a code change with no fresh .metrics/mutate/ fails the plan.
- id: T-35
  type: ci
  title: "CI's invisible-character gate refuses Unicode's whole Default_Ignorable set, as setup steps do"
  why: >
    T-32's gate, made strict by T-33, matches Cf, Zl and Zp, which leaves the characters
    setup-blank found drawn as nothing though Unicode calls them letters or marks: the Hangul
    fillers U+115F, U+1160, U+3164, U+FFA0, U+034F and the variation selectors. The editing tool
    has turned escapes into such characters in three items running, so the gate is the backstop
    that matters. git grep -P takes \p{Default_Ignorable_Code_Point} (tried 2026-10-09, git 2.56,
    naming a planted U+3164), so in both plans the pattern becomes
    [\p{Cf}\p{Default_Ignorable_Code_Point}\p{Zl}\p{Zp}], Cf kept since Unicode's set leaves out a
    few format characters (U+0600, U+FFF9 to U+FFFB), and T-33's test $? -eq 1 kept, under which a
    git whose PCRE2 lacks the property fails the gate rather than passing it. No tracked file holds
    one today. Regenerate AGENTS.md's rules block. tools/hooks/pre-commit runs the same pattern over
    what is staged, git grep --cached with the same exit check, so the commit is refused before it
    leaves the clone: the coordinator committed and pushed a U+202E and a U+3164 the editing tool
    had written into ID-NEW-54's table (4ca60c3), caught only by CI's gate after the push. The
    hook's message names each file and line and says to write the character as an escape.
  done_when:
    - run: >-
        grep -q 'p{Default_Ignorable_Code_Point}' tools/hooks/pre-commit &&
        test "$(grep -c 'p{Default_Ignorable_Code_Point}' itos.yaml)" -ge 2 &&
        grep -q 'p{Default_Ignorable_Code_Point}' AGENTS.md &&
        test "$(grep -c 'test $? -eq 1' itos.yaml)" -ge 2 &&
        { git grep -P -n -I '[\p{Cf}\p{Default_Ignorable_Code_Point}\p{Zl}\p{Zp}]'; test $? -eq 1; }
