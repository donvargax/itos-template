    - run: grep -q 'go mod tidy -diff' itos.yaml
    - run: go mod verify
    - run: go mod tidy -diff
- id: T-22
  type: build
  title: "A SAST baseline: gosec, bundled in the pinned golangci-lint, in the gates"
  why: >
    Was the idea sast-gosec (docs/template-contents.md, Quality: a SAST baseline). gosec is one of
    golangci-lint's linters, so the pinned binary, the pre-commit hook and CI's lint step run it
    once .golangci.yml enables it; no new tool. Tried 2026-10-08: 21 findings. Most are rules
    whose finding is this tool's job, each turned off in .golangci.yml with its reason beside it:
    G204 (a program run with variable words: itos-template runs git and a template's checks as
    lists of words, never a shell, decision 15), G304 (a file read by a variable path: the files a
    template and a made project hold), and G301, G302 and G306 (folder and file modes wider than
    owner-only: a made project's files keep the modes a person shares a project with, 0755 and
    0644). Test code is left out of gosec (_test.go files, features/, and the test-support packages
    releasetest and porttest): it writes fixtures where the test says. What remains is fixed or
    excepted where it stands: G122 in internal/tempdir's writable, a chmod by path inside a
    WalkDir callback, a symlink swapped in mid-walk redirecting it, is fixed with os.Root, its
    Chmod scoped to the folder (go 1.25), the behaviour unchanged and held by tempdir's tests and
    the code proof; G602 in tools/bin/release-notes (listed[i] with i from range over listed) is a
    false positive, a //nolint:gosec on its line saying so. Any other finding the pinned version
    reports is fixed, or excepted on its line with its reason; never a rule turned off for one
    finding.
  done_when:
    - run: grep -q 'gosec' .golangci.yml
    - run: tools/bin/pinned golangci-lint run ./...
    - run: "! grep -n 'os.Chmod' internal/tempdir/tempdir.go"
- id: T-23
  type: test
