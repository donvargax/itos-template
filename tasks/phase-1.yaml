# The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
# a docs, each named in its commit's Task footer (itos commit --task T-2).
# A task:
#
#   - id: T-2
#     type: chore # one of commits.types
#     title: What it is
#     why: Why it is worth doing. # optional
#     done_when: # the checks that prove it, which itos task T-2 runs
#       - run: a command that exits 0 once it is done
- id: T-1
  type: chore
  title: Adopt itos
  why: >
    The commit that adds itos.yaml, this ledger and the work registry names it:
    itos commit --task T-1.
  done_when:
    - run: itos config check
- id: T-2
  type: chore
  title: License itos-template under the AGPL-3.0, as itos is
  why: >
    The user's call (2026-10-06): the AGPL-3.0, the license itos itself carries, before any code
    lands.
  done_when:
    - run: grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
- id: T-3
  type: build
  title: The Go module, a kong command skeleton with --version, and the acceptance harness running the built binary
  why: >
    Bootstrap, first of three (PLAN.md; decision 4). The module github.com/donvargax/itos-template;
    cmd/itos-template on kong, its --version printing the version stamped at build and a dev version
    otherwise; a godog harness in features/ that builds the binary once and runs it, harvested from
    itos's (features/steps_test.go and its suite setup in
    /home/yorch/tmp/llms-safe/gamedev/svg-art/itos, hiding claude, itos and itos-* from the PATH as
    itos's T-087 does, git resolved past any itos linked as git as its T-104 does), not rewritten.
    itos.yaml gains the scenario test kind as itos's has it (tests.scenario, IDs "ID-[A-Z]+-\d+",
    the Scenarios footer feat and fix need, features/smoke.yaml), the Upgrading footer feat and fix
    need (AGENTS.md already asks for it; T-5's release notes quote it), and the Item footer in place
    of Task for test, docs and chore, so a slice's red-first test commit can name its item. The
    first live scenario, @ID-CLI-01 in features/cli.feature, lands in a feat naming it:
    itos-template --version exits 0 and prints the version the harness stamped at build; the dev
    version printed when nothing is stamped is a unit test, since the harness always stamps.
    golangci-lint and govulncheck pinned, run by the pre-commit hook.
  done_when:
    - run: go build ./... && go vet ./...
    - run: go test ./features -count=1
    - run: grep -q 'scenario' itos.yaml
- id: T-4
  type: ci
  title: CI on every push to main, the itos plan and the platform jobs on Linux, macOS and Windows
  why: >
    Bootstrap, second (PLAN.md). Harvested from itos
    (/home/yorch/tmp/llms-safe/gamedev/svg-art/itos/.github/workflows/ci.yml and itos.yaml's ci
    section): the range from the last green run, itos verify over it, the plan in itos.yaml (gofmt,
    go vet, golangci-lint, govulncheck, the unit tests, the smoke scenarios and those the push
    names), and platform jobs running every test on the three systems, since what touches paths and
    line endings breaks on Windows first. Needs the GitHub repository donvargax/itos-template to
    exist. Byte caps on AGENTS.md and docs/ORCHESTRATING.md from the start (itos learned late that
    always-read docs grow: its fe428ad, capping its lessons at ten), checked in the plan and on docs-only pushes. ci.watch's
    provider becomes github, as itos's, so itos push waits for the run and itos status reads it.
    golangci-lint and govulncheck run in the plan at the pins T-3 set (tools/bin/pinned, go.mod's
    tool block): the pre-commit hook that runs them is declared per clone (itos's decision 37), so
    CI is where they hold for every commit. No nightly yet: the whole suite is the smoke set's size.
  done_when:
    - run: test -f .github/workflows/ci.yml && grep -q windows-latest .github/workflows/ci.yml
    - run: grep -q 'ci:' itos.yaml
- id: T-5
  type: ci
  title: "Releases cut by CI: a green push with a feat or a fix releases itself, built by GoReleaser and attested"
  why: >
    Bootstrap, third (PLAN.md). Harvested from itos's T-069 (its release workflow, .goreleaser.yaml
    and tools/bin/release-notes in /home/yorch/tmp/llms-safe/gamedev/svg-art/itos): the version from
    the commits, archives for the three systems with checksums, attested, notes generated quoting
    each Upgrading and BREAKING-CHANGE footer; nothing done by hand, a tag never moved. itos's
    previous-release check (the last release's scenarios against the new binary) comes once there is
    a release to compare with: an idea, not this task.
  done_when:
    - run: test -f .goreleaser.yaml
    - run: grep -rq goreleaser .github/workflows
- id: T-6
  type: build
  title: "itos 6.4.0: the pin and CI's itos action move from 6.0.0"
  why: >
    The person's call, 2026-10-07. What the coordinator uses: itos draft (6.1.0), the coordinator's
    pending changes held while an agent runs and committed between agents; tags on work items, from
    a set work.tags declares (6.2.0); ci watch and push following the newer run when a push's run is
    cancelled (6.3.1); work done passing over commits that touch only the registry (6.4.0). No
    release since 6.0.0 is breaking, and the config gained only work.tags, optional, so nothing else
    changes. The pin's checksums are the SHA-256 of 6.4.0's checksums.txt; the action is pinned to
    the commit v6.4.0 tags, e64df75, as every action here is pinned to a commit.
  done_when:
    - run: grep -q 'version. "6.4.0"' itos.yaml
    - run: "grep -q 'donvargax/itos@e64df756d607dd2312753890cdf32da29c2a9b32 # v6.4.0' .github/workflows/ci.yml"
    - run: "grep -q 'donvargax/itos@e64df756d607dd2312753890cdf32da29c2a9b32 # v6.4.0' .github/workflows/release.yml"
- id: T-7
  type: chore
  title: "Work items carry tags: the command they change, or a concern across commands"
  why: >
    The person's call, 2026-10-07, once itos 6.4.0 (T-6) could: itos.yaml's work.tags declares
    new, check, update and sync, the command an item changes, and cli, ci and windows, the
    concerns that cut across commands, so itos work list --tag shows one part of the work. Each
    open item gets one or two; an undeclared tag is refused by work add, work edit and work check.
  done_when:
    - run: "grep -q 'tags: \\[new, check, update, sync, cli, ci, windows\\]' itos.yaml"
    - run: itos work check
    - run: "itos work list --tag check | grep -q template-scans"
- id: T-8
  type: refactor
  title: "The code in vertical slices over a shared domain, with no mappers (decision 16)"
  why: >
    Decision 16, the person's call, 2026-10-07, applied while the code is small (about 2,600
    lines) and before template-scans, update and sync add to it. Each command is a slice: new and
    check each become one package and one file holding the command's kong struct (its flags, with
    a Run method), its use case, its output and the I/O only it needs; cmd/itos-template/main.go
    only assembles the commands, the version and the exit. A slice imports no other slice: what
    new and check both need (opening a template by cloning it, resolving the answers, rendering
    a combination into a folder and committing it) moves out of newproject into shared packages
    named for what they model, beside manifest, caseform and render. No mappers: the
    flag-to-Options copies in cmd/itos-template/new.go and check.go go, the kong struct being the
    slice's input; newproject's private record struct becomes a domain Record, read and written
    as .itos-template.yaml is, for update and adopt to use later. Turning a domain error into an
    exit code stays at the slice's edge, the only translation left. Anti-corruption layers stay
    where an outside model leaks in: git's output, in internal/git. depguard in .golangci.yml
    refuses a slice package importing another, listing each slice, so the next slice is added to
    it; the person drops it if it gets in the way too often. A file splits only when large or
    complex; a limit on a file's length waits for the idea file-length-limit, after this. Nothing
    a user sees changes: every scenario passes unchanged, and the help and output stay byte for
    byte.
  done_when:
    - run: grep -q depguard .golangci.yml
    - run: "! grep -rn 'type Options struct' cmd internal"
    - run: "! grep -rn '^type record struct' internal"
    - run: "! go list -deps ./internal/check | grep -q 'itos-template/internal/newproject$'"
    - run: go build ./...
- id: T-9
  type: refactor
  title: "Thin UI and application layers over a domain that does the work, through ports (decision 17)"
  why: >
    Decisions 17 and 18, the person's calls, 2026-10-07; their records hold the shape, and the
    person approved a sketch of it in the coordinating session. Each slice (newproject, check) is
    one directory, one file until it grows: its kong struct and Run, the UI, assembling a CQRS
    command or query of domain objects from the flags, the one copy left; and that command and its
    handler, the application, which only wires infra to the domain. The shared domain (manifest,
    answer, project, caseform, render, template, as they stand or renamed in the domain's words)
    does the work and reaches git, files, programs and the terminal only through interfaces in
    port subpackages (template/port and the like), whose signatures use those packages' own plain
    types or the standard library's. Infra (git, tempdir, prompt) implements the ports, each
    asserted with var _ port.X = (*Y)(nil), and imports no package of ours but a port package;
    turning git's output and errors into the ports' terms is its anti-corruption layer, kept
    there. Domain errors become sealed sets of plain domain types, //sumtype:decl, carrying no
    exit code, rule ID or UI wording; infra's errors a sealed set of its own. internal/problem
    goes: its exit codes, its stderr lines and its --json failure object move to internal/cli, the
    UI shared by the slices, whose one switch per sealed set turns errors into exit codes, every
    variant classified and gochecksumtype refusing a switch that leaves one out; only an error no
    switch classified, a bug, exits 70 (docs/CLI.md rule 31). depguard holds the arrows: the
    domain and port packages import no os, os/exec, net, kong, infra, slice or cli package; infra
    imports only port packages of ours; a slice imports no other slice; kong only cmd, cli and the
    slices. Tests follow decision 18: the domain unit-tested in full against fakes of its ports;
    a test of a slice, cli or infra kept only where a scenario cannot reach (asking on a terminal,
    removing a folder on Windows), its comment saying so; nothing a test held is lost, it moves to
    the domain or the scenarios hold it. Nothing a user sees changes: every scenario passes
    unchanged, the help, the output, the exit codes and --json byte for byte.
  done_when:
    - run: grep -q gochecksumtype .golangci.yml
    - run: grep -rq 'sumtype:decl' internal
    - run: "! test -d internal/problem"
    - run: test -d internal/cli
    - run: 'test -z "$(go list -f ''{{join .Imports "\n"}}'' ./internal/git ./internal/tempdir ./internal/prompt | grep itos-template/internal/ | grep -v /port$)"'
    - run: "test -z \"$(grep -rl alecthomas/kong --include='*.go' internal | grep -v -e '^internal/cli/' -e '^internal/newproject/' -e '^internal/check/')\""
    - run: go build ./...
