# The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
# a docs, each named in its commit's Task footer (itos commit --task T-2).
# A task:
#
#   - id: T-2
#     type: chore # one of commits.types
#     title: What it is
#     why: Why it is worth doing. # optional
#     done_when: # the checks that prove it, which itos task T-2 runs
#       - run: a command that exits 0 once it is done
- id: T-1
  type: chore
  title: Adopt itos
  why: >
    The commit that adds itos.yaml, this ledger and the work registry names it:
    itos commit --task T-1.
  done_when:
    - run: itos config check
- id: T-2
  type: chore
  title: License itos-template under the AGPL-3.0, as itos is
  why: >
    The user's call (2026-10-06): the AGPL-3.0, the license itos itself carries, before any code
    lands.
  done_when:
    - run: grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
- id: T-3
  type: build
  title: The Go module, a kong command skeleton with --version, and the acceptance harness running the built binary
  why: >
    Bootstrap, first of three (PLAN.md; decision 4). The module github.com/donvargax/itos-template;
    cmd/itos-template on kong, its --version printing the version stamped at build and a dev version
    otherwise; a godog harness in features/ that builds the binary once and runs it, harvested from
    itos's (features/steps_test.go and its suite setup in
    /home/yorch/tmp/llms-safe/gamedev/svg-art/itos, hiding claude, itos and itos-* from the PATH as
    itos's T-087 does, git resolved past any itos linked as git as its T-104 does), not rewritten.
    itos.yaml gains the scenario test kind as itos's has it (tests.scenario, IDs "ID-[A-Z]+-\d+",
    the Scenarios footer feat and fix need, features/smoke.yaml), the Upgrading footer feat and fix
    need (AGENTS.md already asks for it; T-5's release notes quote it), and the Item footer in place
    of Task for test, docs and chore, so a slice's red-first test commit can name its item. The
    first live scenario, @ID-CLI-01 in features/cli.feature, lands in a feat naming it:
    itos-template --version exits 0 and prints the version the harness stamped at build; the dev
    version printed when nothing is stamped is a unit test, since the harness always stamps.
    golangci-lint and govulncheck pinned, run by the pre-commit hook.
  done_when:
    - run: go build ./... && go vet ./...
    - run: go test ./features -count=1
    - run: grep -q 'scenario' itos.yaml
- id: T-4
  type: ci
  title: CI on every push to main, the itos plan and the platform jobs on Linux, macOS and Windows
  why: >
    Bootstrap, second (PLAN.md). Harvested from itos
    (/home/yorch/tmp/llms-safe/gamedev/svg-art/itos/.github/workflows/ci.yml and itos.yaml's ci
    section): the range from the last green run, itos verify over it, the plan in itos.yaml (gofmt,
    go vet, golangci-lint, govulncheck, the unit tests, the smoke scenarios and those the push
    names), and platform jobs running every test on the three systems, since what touches paths and
    line endings breaks on Windows first. Needs the GitHub repository donvargax/itos-template to
    exist. Byte caps on AGENTS.md and docs/ORCHESTRATING.md from the start (itos learned late that
    always-read docs grow: its fe428ad, capping its lessons at ten), checked in the plan and on docs-only pushes. ci.watch's
    provider becomes github, as itos's, so itos push waits for the run and itos status reads it.
    golangci-lint and govulncheck run in the plan at the pins T-3 set (tools/bin/pinned, go.mod's
    tool block): the pre-commit hook that runs them is declared per clone (itos's decision 37), so
    CI is where they hold for every commit. No nightly yet: the whole suite is the smoke set's size.
  done_when:
    - run: test -f .github/workflows/ci.yml && grep -q windows-latest .github/workflows/ci.yml
    - run: grep -q 'ci:' itos.yaml
- id: T-5
  type: ci
  title: "Releases cut by CI: a green push with a feat or a fix releases itself, built by GoReleaser and attested"
  why: >
    Bootstrap, third (PLAN.md). Harvested from itos's T-069 (its release workflow, .goreleaser.yaml
    and tools/bin/release-notes in /home/yorch/tmp/llms-safe/gamedev/svg-art/itos): the version from
    the commits, archives for the three systems with checksums, attested, notes generated quoting
    each Upgrading and BREAKING-CHANGE footer; nothing done by hand, a tag never moved. itos's
    previous-release check (the last release's scenarios against the new binary) comes once there is
    a release to compare with: an idea, not this task.
  done_when:
    - run: test -f .goreleaser.yaml
    - run: grep -rq goreleaser .github/workflows
- id: T-6
  type: build
  title: "itos 6.4.0: the pin and CI's itos action move from 6.0.0"
  why: >
    The person's call, 2026-10-07. What the coordinator uses: itos draft (6.1.0), the coordinator's
    pending changes held while an agent runs and committed between agents; tags on work items, from
    a set work.tags declares (6.2.0); ci watch and push following the newer run when a push's run is
    cancelled (6.3.1); work done passing over commits that touch only the registry (6.4.0). No
    release since 6.0.0 is breaking, and the config gained only work.tags, optional, so nothing else
    changes. The pin's checksums are the SHA-256 of 6.4.0's checksums.txt; the action is pinned to
    the commit v6.4.0 tags, e64df75, as every action here is pinned to a commit.
  done_when:
    - run: grep -q 'version. "6.4.0"' itos.yaml
    - run: "grep -q 'donvargax/itos@e64df756d607dd2312753890cdf32da29c2a9b32 # v6.4.0' .github/workflows/ci.yml"
    - run: "grep -q 'donvargax/itos@e64df756d607dd2312753890cdf32da29c2a9b32 # v6.4.0' .github/workflows/release.yml"
- id: T-7
  type: chore
  title: "Work items carry tags: the command they change, or a concern across commands"
  why: >
    The person's call, 2026-10-07, once itos 6.4.0 (T-6) could: itos.yaml's work.tags declares
    new, check, update and sync, the command an item changes, and cli, ci and windows, the
    concerns that cut across commands, so itos work list --tag shows one part of the work. Each
    open item gets one or two; an undeclared tag is refused by work add, work edit and work check.
  done_when:
    - run: "grep -q 'tags: \\[new, check, update, sync, cli, ci, windows\\]' itos.yaml"
    - run: itos work check
    - run: "itos work list --tag check | grep -q template-scans"
- id: T-8
  type: refactor
  title: "The code in vertical slices over a shared domain, with no mappers (decision 16)"
  why: >
    Decision 16, the person's call, 2026-10-07, applied while the code is small (about 2,600
    lines) and before template-scans, update and sync add to it. Each command is a slice: new and
    check each become one package and one file holding the command's kong struct (its flags, with
    a Run method), its use case, its output and the I/O only it needs; cmd/itos-template/main.go
    only assembles the commands, the version and the exit. A slice imports no other slice: what
    new and check both need (opening a template by cloning it, resolving the answers, rendering
    a combination into a folder and committing it) moves out of newproject into shared packages
    named for what they model, beside manifest, caseform and render. No mappers: the
    flag-to-Options copies in cmd/itos-template/new.go and check.go go, the kong struct being the
    slice's input; newproject's private record struct becomes a domain Record, read and written
    as .itos-template.yaml is, for update and adopt to use later. Turning a domain error into an
    exit code stays at the slice's edge, the only translation left. Anti-corruption layers stay
    where an outside model leaks in: git's output, in internal/git. depguard in .golangci.yml
    refuses a slice package importing another, listing each slice, so the next slice is added to
    it; the person drops it if it gets in the way too often. A file splits only when large or
    complex; a limit on a file's length waits for the idea file-length-limit, after this. Nothing
    a user sees changes: every scenario passes unchanged, and the help and output stay byte for
    byte.
  done_when:
    - run: grep -q depguard .golangci.yml
    - run: "! grep -rn 'type Options struct' cmd internal"
    - run: "! grep -rn '^type record struct' internal"
    - run: "! go list -deps ./internal/check | grep -q 'itos-template/internal/newproject$'"
    - run: go build ./...
- id: T-9
  type: refactor
  title: "Thin UI and application layers over a domain that does the work, through ports (decision 17)"
  why: >
    Decisions 17 and 18, the person's calls, 2026-10-07; their records hold the shape, and the
    person approved a sketch of it in the coordinating session. Each slice (newproject, check) is
    one directory, one file until it grows: its kong struct and Run, the UI, assembling a CQRS
    command or query of domain objects from the flags, the one copy left; and that command and its
    handler, the application, which only wires infra to the domain. The shared domain (manifest,
    answer, project, caseform, render, template, as they stand or renamed in the domain's words)
    does the work and reaches git, files, programs and the terminal only through interfaces in
    port subpackages (template/port and the like), whose signatures use those packages' own plain
    types or the standard library's. Infra (git, tempdir, prompt) implements the ports, each
    asserted with var _ port.X = (*Y)(nil), and imports no package of ours but a port package;
    turning git's output and errors into the ports' terms is its anti-corruption layer, kept
    there. Domain errors become sealed sets of plain domain types, //sumtype:decl, carrying no
    exit code, rule ID or UI wording; infra's errors a sealed set of its own. internal/problem
    goes: its exit codes, its stderr lines and its --json failure object move to internal/cli, the
    UI shared by the slices, whose one switch per sealed set turns errors into exit codes, every
    variant classified and gochecksumtype refusing a switch that leaves one out; only an error no
    switch classified, a bug, exits 70 (docs/CLI.md rule 31). depguard holds the arrows: the
    domain and port packages import no os, os/exec, net, kong, infra, slice or cli package; infra
    imports only port packages of ours; a slice imports no other slice; kong only cmd, cli and the
    slices. Tests follow decision 18: the domain unit-tested in full against fakes of its ports;
    a test of a slice, cli or infra kept only where a scenario cannot reach (asking on a terminal,
    removing a folder on Windows), its comment saying so; nothing a test held is lost, it moves to
    the domain or the scenarios hold it. Nothing a user sees changes: every scenario passes
    unchanged, the help, the output, the exit codes and --json byte for byte.
  done_when:
    - run: grep -q gochecksumtype .golangci.yml
    - run: grep -rq 'sumtype:decl' internal
    - run: "! test -d internal/problem"
    - run: test -d internal/cli
    - run: 'test -z "$(go list -f ''{{join .Imports "\n"}}'' ./internal/git ./internal/tempdir ./internal/prompt | grep itos-template/internal/ | grep -v /port$)"'
    - run: "test -z \"$(grep -rl alecthomas/kong --include='*.go' internal | grep -v -e '^internal/cli/' -e '^internal/newproject/' -e '^internal/check/')\""
    - run: go build ./...
- id: T-10
  type: build
  title: "depguard refuses the mocking libraries (decision 19)"
  why: >
    Decision 19, the person's call, 2026-10-07: tests use our own fakes and stubs, never mocks,
    which script and check calls. A lint holds it, so no mock can come in by a dependency:
    depguard in .golangci.yml refuses github.com/golang/mock, go.uber.org/mock,
    github.com/stretchr/testify/mock, github.com/vektra/mockery and
    github.com/maxbrunsfeld/counterfeiter in every package, test files included, its message
    naming decision 19. A hand-written expectation recorder is held by AGENTS.md, which no lint
    can decide.
  done_when:
    - run: grep -q 'testify/mock' .golangci.yml
    - run: grep -q 'go.uber.org/mock' .golangci.yml
    - run: tools/bin/pinned golangci-lint run ./...
- id: T-11
  type: build
  title: "A Go file is at most 600 lines of code, revive's file-length-limit"
  why: >
    Decision 17 keeps a slice in one file until it grows large or complex; a limit says when. The
    person's call, 2026-10-07, once T-9 reshaped the code: 600 lines, comments and blank lines not
    counted, set by revive's file-length-limit in the pinned golangci-lint, tests included. The
    largest file then, internal/manifest/manifest.go, is 584 lines with them counted, so nothing
    splits now; it is the first that will. A file over the limit splits by what it holds, in the
    domain's words, never by line count alone.
  done_when:
    - run: grep -q file-length-limit .golangci.yml
    - run: tools/bin/pinned golangci-lint run ./...
- id: T-12
  type: test
  title: "Property-based tests of the domain with rapid, one case per push (decision 20)"
  why: >
    Decision 20, the person's call, 2026-10-07. pgregory.net/rapid joins go.mod for tests only.
    Properties are unit tests of the domain (decision 19) and live in the domain packages' tests
    only; depguard refuses rapid anywhere else. The properties: the manifest takes a case-forms
    literal exactly when its five forms are five different strings, so it refuses every literal
    whose forms collide and accepts every other (manifest; caseform's forms of any words may
    collide, bug-1, so the property is the manifest's), and an answer's forms round-trip to it
    (caseform); the same template,
    choice and answers render the same bytes, line endings are never changed and a binary file is
    copied byte for byte (render, template, against porttest's fakes); every derived combination
    has its needs chosen and none is unsupported, and Parse never panics on any bytes (manifest);
    a Record written and read back is the same Record (project); a default is always an answer
    its question takes (answer). Generators build valid domain values (a manifest, a tree of files,
    answers) so a property states something about the domain, never about random noise. Every
    push runs them with RAPID_CHECKS=1: the CI plan's go test step and the platform jobs set it,
    so they stay as fast as unit tests and each push tries a new case; a failure prints its seed
    and writes the file that replays it, which is never committed. The nightly run's high count
    and rapid.MakeFuzz on the parsers belong to the idea nightly.
  done_when:
    - run: grep -q pgregory.net/rapid go.mod
    - run: grep -q 'RAPID_CHECKS=1' itos.yaml
    - run: grep -q 'RAPID_CHECKS' .github/workflows/ci.yml
    - run: "test -z \"$(grep -rl pgregory.net/rapid --include='*.go' internal cmd features | grep -v -e '^internal/answer/' -e '^internal/caseform/' -e '^internal/manifest/' -e '^internal/project/' -e '^internal/render/' -e '^internal/template/')\""
    - run: RAPID_CHECKS=1 go test ./internal/...
- id: T-13
  type: ci
  title: "Each domain package keeps at least 80% unit-test coverage"
  why: >
    Decision 19 has the domain unit-tested in full; a floor holds it. The person's call,
    2026-10-07, with the numbers after T-9 (manifest 92%, caseform 96%, template 89%, render 88%,
    project 82%, answer 79%): 80% of statements in each domain package, measured by go test
    -coverprofile with RAPID_CHECKS=1, so a property's one case counts as a unit test's does. A
    script in tools/bin reads the domain packages from depguard's domain rule in .golangci.yml,
    the one list of them, so a new domain package is measured without being named twice; the CI
    plan runs it after the unit tests, naming each package under the floor and its figure. answer
    is lifted above it first, by tests of its behaviour, never by tests written only to touch
    lines. After T-12, so its properties count. Their one random case per push can reach a branch
    one push and miss it the next, so a package near the floor may fail with no change: the person
    wants that failure seen, since it names a branch no example test pins, and fixed by writing
    that test; never by a fixed RAPID_SEED or by leaving properties out of the count, which would
    hide it.
  done_when:
    - run: test -x tools/bin/domain-coverage
    - run: grep -q domain-coverage itos.yaml
    - run: tools/bin/domain-coverage
- id: T-14
  type: build
  title: "Renovate keeps the Go modules and the workflows' actions current, landing on main once CI is green"
  why: >
    The owner's call, 2026-10-07, before first-template, so the template carries a Renovate setup
    proven here (docs/template-contents.md lists Renovate in a made project's first day).
    Renovate runs centrally from donvargax/github-admin with the owner's GitHub App
    (donvargax-renovate), every four hours, over each repository the App is installed on that has
    a config; the owner installs it here. The shared rules are the owner's presets,
    github.com/donvargax/renovate-config, pinned by tag: default.json (the Monday 00:00-05:59 UTC
    window, a seven-day wait on every release but the owner's own, automerge on green CI, the
    Dependency Dashboard, OSV vulnerability alerts, a security fix skipping the window and the
    wait) and go.json (gomodTidy, gomodUpdateImportPaths). donvargax/project-template is the
    working example (.github/renovate.json5; its T-026, T-038 to T-040; its ci.yml on
    renovate/**). The decisions. .github/renovate.json5 extends
    github>donvargax/renovate-config#v1.3.0 and github>donvargax/renovate-config:go#v1.3.0, with
    enabledManagers gomod, github-actions and renovate-config. Every Renovate commit passes the
    commit-msg rules CI re-checks (itos verify): semanticCommits enabled; build, with no scope,
    for the Go modules (they change what the binary is built from), and ci, with no scope, for
    the workflows' actions and the presets' pin (they change CI's configuration), the owner's
    call over build for all, through packageRules matching every package and then those two
    managers, and a lockFileMaintenance block with build, since no package rule reaches lockfile
    maintenance; a commitBody saying what moved, each dependency from its version to the next,
    with no body line starting with a word and a colon, which git reads as a footer;
    commitTrailers ["Task: T-14"], so every Renovate commit makes CI run this task's checks and
    re-prove the config. A sample message of each type passes itos commit check-message.
    Branch automerge (automergeType branch): Renovate fast-forwards main to its renovate/**
    branch once CI is green there, so no pull request is opened unless CI goes red and main takes
    no merge commits; ci.yml runs on push to renovate/** for it, keeping its pull_request
    trigger for the pull request a red branch gets, its comment saying so (the owner confirmed
    branch automerge over bot pull requests). itos ci range already starts such a branch's range
    at the last green run on main, which the branch descends from; the first Renovate branch
    confirms it. automergeSchedule at any time, so a branch made in the window lands whenever it
    goes green. github-actions with pinDigests, so an action's SHA and its version comment move
    together, as project-template writes them. Renovate does not move tools/bin/pinned (each
    version has hashes beside it a version-only update would leave stale; no custom manager, it
    moves by hand) nor itos: ignoreDeps donvargax/itos, since the itos action in ci.yml and
    release.yml moves with itos.yaml's pin, by itos upgrade, as T-6 moved them together.
    govulncheck, in go.mod's tool block, moves by the gomod manager. A dependency update cuts no
    release until T-15. The checks run on every Renovate push and need the network, as
    project-template's do; at one update a week the cost is accepted. renovate exits 0 on an
    invalid config, so the second check asks for the line it prints only once the presets
    resolved and the dependencies were extracted.
  done_when:
    - run: test -f .github/renovate.json5
    - run: npx --yes --package renovate -- renovate-config-validator --strict .github/renovate.json5
    - run: >-
        t=$(mktemp) && npx --yes --package renovate -- renovate --platform=local
        --dry-run=extract > "$t" 2>&1; grep -q 'Extracted dependencies' "$t"
- id: T-15
  type: build
  title: "A release cuts a patch when the binary's linked modules or its Go toolchain changed"
  why: >
    The owner's call, 2026-10-07 (decision 23): a dependency update Renovate lands (T-14) is a
    build commit, which released nothing, so a security fix in a module the binary links, or in
    Go's standard library, reached no user until the next feat or fix. tools/bin/release-version
    keeps its rules (a breaking change a major, a feat a minor, a fix a patch) and adds one,
    after them: with none of those, a patch when, between the last release's tag and HEAD, the
    modules ./cmd/itos-template links changed (go list -deps, each package's module path and
    version, at both commits, the tag read from a worktree or git archive of it), or the Go
    toolchain it is built with changed (go.mod's toolchain line, else its go line, at both).
    What leaves the binary as it was releases nothing: a test-only module (godog, rapid), a tool
    of go.mod's tool block (govulncheck), a go.sum-only change, an indirect module the binary
    never links, a workflow's action. Its line on stderr says why, naming each module that moved
    or the toolchain, so the release's run shows it. internal/release's tests and
    release-version's hold the rule with example repositories (decision 19), the module-path
    check from itos's T-089 kept as it is.
  done_when:
    - run: go test ./tools/bin/release-version/... ./internal/release/...
    - run: grep -q 'toolchain' tools/bin/release-version/main.go
- id: T-16
  type: build
  title: "A release's notes say why a patch with no fix was cut, naming what moved beneath the binary"
  why: >
    Found with T-15, 2026-10-07: tools/bin/release-version cuts a patch when the modules the
    binary links or its Go toolchain moved (decision 23), but tools/bin/release-notes' opening
    line still counts feats, fixes and breaking changes and says a fix makes a patch, so such a
    release reads 0 feats, 0 fixes and 0 breaking changes with no reason given, and Renovate's Go
    updates (T-14) will cut such releases weekly. The notes' opening line says the binary is built
    from what moved, each module old to new and the toolchain, from internal/release's Moved, as
    release-version's stderr line names them, one source for both, never computed twice; the
    build commits under What changed already list the updates. A release cut for a feat, a fix
    or a breaking change reads as it does today. Its Upgrading section says there is nothing to
    change when no footer asks for anything. Tests with example repositories, as release-version's
    (decision 19).
  done_when:
    - run: go test ./tools/bin/release-notes/... ./internal/release/...
    - run: grep -q 'Moved' tools/bin/release-notes/main.go
- id: T-17
  type: refactor
  title: "The stack question's wording lives in the UI, the domain giving only what is asked"
  why: >
    Found with T-9 (the idea asker-words): template.Choose words the stack question, Which stack
