    itos-cc mutates test support outside _test.go files (internal/template/port/porttest) like code,
    with no way to leave it out (donvargax/itos-cc#16): until then a change to a fake needs it
    covered. A line only another OS builds or runs is uncovered wherever the proof runs, and no
    exception excuses it (tried 2026-10-08: a _windows.go file's sites listed and uncovered on
    Linux; donvargax/itos-cc#18). So decision 26 (q-26) holds: knowledge that differs by OS is a
    function taking the OS as a value, a build-tagged file holds only a call one OS lacks and no
    mutation site, and AGENTS.md says so beside the proof's step.
  done_when:
    - run: tools/bin/pinned itos-cc version | grep -qx 'itos-cc 0.5.0'
    - run: "grep -qF 'tools/bin/pinned itos-cc mutation check --since {base} --fail-uncovered --json' itos.yaml"
    - run: grep -q 'itos-cc mutation sample' itos.yaml
    - run: grep -q 'itos-cc mutation run --since' AGENTS.md
    - run: grep -q 'runtime.GOOS' AGENTS.md
    - run: tools/bin/pinned itos-cc mutation check --since HEAD --fail-uncovered --json
- id: T-21
  type: ci
  title: "CI checks the locked install: go mod verify, and go.mod and go.sum tidy"
  why: >
    Was the idea locked-installs-check (docs/template-contents.md, Every project: locked installs
    everywhere, the lockfile committed and checked). Tried 2026-10-08: the idea's -mod=readonly is
    already go's own default with no vendor folder (go help build: "Otherwise, the go command acts
    as if -mod=readonly were set"), so builds and tests refuse a go.mod they would have to change
    and need no flag. What is not checked: that the module cache holds what go.sum says (go mod
    verify), and that go.mod and go.sum are complete and hold nothing the code does not use (go mod
    tidy -diff, go 1.23 and later, printing what tidy would change and exiting 1). Both pass today.
    Two static steps in itos.yaml's CI plan, after go vet, so the modules are downloaded already;
    the platform jobs run go test alone and need neither, one system judging the lock. The tools
    are locked elsewhere already: tools/bin/pinned by hash, govulncheck in go.mod's tool block, the
    actions by commit.
  done_when:
