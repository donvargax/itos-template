# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: donvargax # the ledger's phase 1: a handle, or null
queue:
  - T-3
  - T-4
  - T-5
  - new-renders
items:
  - id: T-2
    title: License itos-template under the AGPL-3.0, as itos is
    phase: 1
    owner: null
    status: doing
    depends_on: []
    kind: task
    why: >
      The user's call (2026-10-06): the AGPL-3.0, the license itos itself carries, before any code
      lands.
  - id: T-3
    title: The Go module, a kong command skeleton with --version, and the acceptance harness running the built binary
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Bootstrap, first of three (PLAN.md; decision 4). The module
      github.com/donvargax/itos-template; cmd/itos-template on kong, its --version printing the
      version stamped at build and a dev version otherwise; a godog harness in features/ that builds
      the binary once and runs it, harvested from itos's (features/steps_test.go and its suite setup
      in /home/yorch/tmp/llms-safe/gamedev/svg-art/itos, hiding claude, itos and itos-* from the
      PATH as itos's T-087 does, git resolved past any itos linked as git as its T-104 does), not
      rewritten. itos.yaml gains the scenario test kind as itos's has it (tests.scenario, the
      Scenarios footer feat and fix need, features/smoke.yaml), and the first live scenario,
      --version, lands in a feat naming it. golangci-lint and govulncheck pinned, run by the
      pre-commit hook.
  - id: T-4
    title: CI on every push to main, the itos plan and the platform jobs on Linux, macOS and Windows
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Bootstrap, second (PLAN.md). Harvested from itos
      (/home/yorch/tmp/llms-safe/gamedev/svg-art/itos/.github/workflows/ci.yml and itos.yaml's ci
      section): the range from the last green run, itos verify over it, the plan in itos.yaml
      (gofmt, go vet, golangci-lint, govulncheck, the unit tests, the smoke scenarios and those the
      push names), and platform jobs running every test on the three systems, since what touches
      paths and line endings breaks on Windows first. Needs the GitHub repository
      donvargax/itos-template to exist. Byte caps on AGENTS.md and docs/ORCHESTRATING.md from the
      start (itos learned late that always-read docs grow: its T-110), checked in the plan and on
      docs-only pushes.
  - id: T-5
    title: "Releases cut by CI: a green push with a feat or a fix releases itself, built by GoReleaser and attested"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Bootstrap, third (PLAN.md). Harvested from itos's T-069 (its release workflow,
      .goreleaser.yaml and tools/bin/release-notes in
      /home/yorch/tmp/llms-safe/gamedev/svg-art/itos): the version from the commits, archives for
      the three systems with checksums, attested, notes generated quoting each Upgrading and
      BREAKING-CHANGE footer; nothing done by hand, a tag never moved. itos's previous-release check
      (the last release's scenarios against the new binary) comes once there is a release to compare
      with: an idea, not this task.
  - id: new-renders
    title: "itos-template new renders a project: the manifest, a stack merged with the chosen features, literals substituted with their case forms, what was rendered recorded"
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [T-3]
    kind: idea
    why: >
      The first useful slice (PLAN.md, order of work 2; decisions 1 and 2). Settle in its scenarios:
      the manifest's format and place in the template repository, how a template is named (a path or
      a git URL), the record a made project keeps (tag, stack, features, answers) and where, asking
      on a terminal for answers not given, refusing a feature whose stack or dependency is missing.
  - id: template-check
    title: itos-template check renders every combination a template allows and runs its checks, scanning for leftover literals and leaked credentials
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [new-renders]
    kind: idea
    why: >
      PLAN.md, order of work 3: the template proves itself. The combinations and each one's check
      commands come from the manifest; a combination not listed is unsupported, never offered.
  - id: update-merges
    title: itos-template update brings a project to a newer template release by a 3-way merge of the old and new renders
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [new-renders]
    kind: idea
    why: >
      PLAN.md, order of work 4; decision 3. Conflicts are left for the person as git leaves them;
      the update lands as an ordinary commit through the project's gates, saying which release it
      came from.
  - id: template-sync
    title: itos-template sync merges a template root down into its stacks and the stacks into their features
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [new-renders]
    kind: idea
    why: >
      PLAN.md, order of work 5: the upkeep the branch model costs (decision 2), never a rebase.
  - id: first-template
    title: This repository's skeleton, its domain stripped, becomes the first template's stack/go and go/cli
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [template-check]
    kind: idea
    why: >
      PLAN.md, order of work 6; decision 4: the generator is the proof that a template made to
      docs/template-contents.md works. Which repository holds the template (its own, beside this
      one) is settled then.
  - id: renovate
    title: Renovate keeps the dependencies current, merging an update only when CI is green on its head
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [T-4]
    kind: idea
    why: >
      docs/template-contents.md: semantic chore(deps) commits, a release-age cooldown, rebase
      auto-merge, actions pinned by digest. Waits on itos accepting the bot's commits (itos's
      p1-bot-dependency-prs) and its PR mode (p1-pr-mode); until then updates are made by hand.
  - id: devcontainer
    title: A devcontainer to run agents sandboxed, taken from itos once its T-108 lands
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      docs/template-contents.md lists it for every project; itos's T-108 builds and proves one (sudo
      removed, the egress allowlist, the git shim first). Copy it once that lands, not before.
  - id: previous-release
    title: CI runs the last release scenarios against a new binary, as itos does
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [T-5]
    kind: idea
    why: >
      itos's T-071: a feat may not change an old scenario, a fix names each it changes. Needs a
      first release.
