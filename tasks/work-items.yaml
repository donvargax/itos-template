  - id: new-setup
    title: "A template's setup steps: the manifest lists them per branch, new runs them once trusted, and itos template setup runs them in a clone"
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      Decision 7, superseding 5 and 6: the generator knows no itos and no stack's hook tool. The
      manifest lists setup steps per branch (the root of a template using itos lists itos hook
      install; stack/go its git config lines for tools/hooks/pre-commit; vite-plus none, its package
      install setting its hooks up). new runs the chosen branches' steps after rendering, and a
      setup command (itos template setup, the same code) runs them in a clone new did not make.
      Steps are a template's code, so as copier's --trust: shown and asked on a terminal, or run
      under --trust, never silently. Settle in its scenarios: the steps' shape in the manifest,
      their order across root, stack and features, what a refused or failed step leaves, and where
      new records what the clone command reads.
    tags: [new]
  - id: new-picker
    title: new picks the stack and features from lists on a terminal, with charmbracelet/huh
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      Decision 13, weighed with the user (2026-10-06): huh comes when it brings value, and a pick
      list for the stack and the features is that value; new-renders asks for free-text answers
      alone, with plain prompts behind a small prompt interface so huh can replace them. Weighed
      then: huh v1.0.0 (2026-02-23), MIT, active, 26 modules and about 4.7 MB in a probe binary,
      against golang.org/x/term's one. Settle here docs/CLI.md's rule 30 (no colour): huh's
      monochrome theme, or CLIG's colour on a terminal, none under NO_COLOR or when not one. Prompts
      are unit-tested, through huh's accessible mode, since scenarios run with no terminal (rule
      37).
    tags: [new, cli]
  - id: adopt
    title: itos-template adopt writes the record for an existing project, so it can take template updates
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1, update-merges]
    kind: idea
    why: >
      A project made before the template, itos or itos-cc say, has files and history, so new refuses
      its folder (decision 12) and nothing records which template release it matches. update
      re-renders the old release from the record (decisions 3 and 10), not from the project's first
      commit, so adopting is writing that record from the answers that match the project, as cruft
      link does. Settle in its scenarios: how the release and answers are chosen, and how a project
      that differs from the render is shown the difference before its first update.
    tags: [update]
  - id: template-releases
    title: A template release tags every branch, and new renders the newest release or the one --ref names
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      Decision 9 has --ref pick a tag, by default the newest release; decision 10 left how one
      release is tagged across a template's branches for later, the recorded commits being enough to
      reproduce a render. new-renders renders the branches' heads; this item settles the tagging (a
      tag per branch under one version, say stack/go/v1.2.0, or one tag on a commit reaching every
      branch), then new's --ref and its default, and the record's release field.
    tags: [new, update]
  - id: new-first-commit-rules
    title: A made project's first commit passes the template's own commit rules
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      slice-1's new commits the render as 'chore: make the project from its template', with no
      footer. A template that uses itos (or any commit lint) holds that commit to its rules on the
      made project's first push, when CI has no green run to start from and judges the whole
      history: a chore needing a Task footer fails it. Settle in its scenarios whether the manifest
      gives the first commit's message, or the template's itos.yaml starts its rules after it
      (commits.since).
    tags: [new]
  - id: new-template-name
    title: "What the record keeps of how a template was named: a relative path, a URL with credentials"
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      slice-1 records the template exactly as it was named (decision 10). A relative path (../acme)
      reaches the template only from the folder new ran in, so update run from the made project
      cannot; a URL with a user and password (https://user:token@host/…) would put a credential in a
      committed file, against PLAN.md's no-credentials principle (decision 9 has git's own
      credential helpers supply them). Settle in its scenarios whether new resolves a path against
      its working folder, and refuses or strips a URL's credentials.
    tags: [new]
  - id: template-special-files
    title: new renders a template's symbolic links on Windows and its submodules
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      slice-1 renders symbolic links by making them, which Windows refuses without the right to (new
      then exits 3 and writes nothing), and refuses a template holding a submodule (exit 1); no
      scenario holds either. Settle in its scenarios what a render does with each on every system:
      git's own core.symlinks behaviour (a file holding the target) and a submodule's commit
      recorded as a gitlink are the candidates.
    tags: [new, windows]
  - id: template-scans
    title: itos-template check scans every render for leftover literals and leaked credentials
    phase: 1
    owner: donvargax
    status: todo
    depends_on: [slice-2]
    kind: idea
    why: >
      Split from template-check (slice-2), so the render-and-check loop lands first (PLAN.md, order
      of work 3; principle 5). The leftover-literal scan looks for each literal, in each case form,
      left in a render; it is ours, built on the case-forms package of slice-1. The
      leaked-credential scan is a library or our own patterns, to weigh with the person by decision
      13 when specifying: gitleaks (wide rules, a heavy dependency) against a small set of our own.
    tags: [check]
  - id: check-json
    title: itos-template check --json prints the report as one object, for scripts
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-2]
    kind: idea
    why: >
      docs/CLI.md rules 10 and 27 give every command a --json output, and the contract with scripts
      is the exit code and --json, never the plain output. slice-2 shipped check with its plain
      report only, since no scenario described a --json one: a combination each, its checks with
      their words, status and output, as new prints its result.
    tags: [check, cli]
  - id: check-ci-branches
    title: itos-template check renders a CI checkout without a fetch recipe
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-2]
    kind: idea
    why: >
      check clones the template, so in a CI checkout (one branch, perhaps a detached HEAD) a
      template needs a fetch of every branch as a local branch and HEAD on its root first
      (docs/manifest.md, Checking a template in its CI). check could read the remote-tracking
      branches and the root from the origin when the template is the folder it runs in, and work
      from a subfolder of it too, so a template CI step is one line.
    tags: [check, ci]
