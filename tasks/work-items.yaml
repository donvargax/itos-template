  - id: upstream-fixes
    title: Take up the itos and itos-cc fixes filed from here as their releases land
    phase: 1
    owner: donvargax
    status: todo
    depends_on: []
    kind: idea
    why: >
      Filed 2026-10-08, each with what it changes here once released and pinned. itos: #21 the lint
      misreads a body line starting with a hash (drop the lesson); #22 itos tests list in the form
      itos-cc reads (the idea listed-tests); #23 the action installs the launcher its ref names (the
      idea launcher-version); #24 proof.code.paths and the check can drift (drop cmd internal from
      the check if a placeholder comes); #25 work done says what a passing proof judged; #26 the
      proof judges other items' commits; #27 the generated AGENTS.md block grows with each CI step
      (an option to shorten it); #28 the proof runs in itos ci run (the idea proof-in-ci). itos-cc:
      #15 a failing listed-tests coverage run reads as uncovered; #16 leave test support (porttest)
      out of mutation; #17 release notes; #18 code only another OS builds is uncovered; #19 version
      prints 0.5.0 or v0.5.0 (T-20's check greps the release form); #20 an --all-tests kill stays
      fresh when its scenarios change; #21 a passing sample reads as an error annotation; #22 a
      comment-only change makes a function changed; #23 a statement no test runs passes when it
      holds no site (decision 27's main gap: run()'s untested error paths then need tests); #24
      return-value and call mutators. Check them with gh issue list -R donvargax/itos --author @me
      and the same for itos-cc.

      itos#34 (2026-10-09): the Claude Code guard judges git commit by the session's folder, not one
      a cd in the same command moved to, so a test building a fixture repository with cd and git
      commit is denied and falls back to git commit-tree. When fixed and pinned, a brief no longer
      needs to warn about it.

      itos#35 (2026-10-09): under 7.0.0-rc.3 a whole CI run, with no green run to start from, judges
      no code proof, so a first push or a new branch lands code unproved. itos#36: the text plan
      does not name the proof step and itos init --agent-rules leaves it out of AGENTS.md's gate
      list; T-34's first check was written from that output and could never pass. When fixed and
      pinned, AGENTS.md's rules block names the proof itself.

      itos-cc#36 (2026-10-11, found by T-43): strict Go coverage evidence fingerprints the raw
      GOTOOLCHAIN, which actions/setup-go sets to local and a shell leaves unset, so records made
      here read coverage-stale in CI. tools/bin/pinned exports GOTOOLCHAIN=local for itos-cc
      meanwhile (6e0d92d); when fixed and pinned, drop that line and rerun the strict coverage once.

      itos-cc#37 (2026-10-11, found by T-43): strict Go coverage takes every .go file on disk under
      the module as an input, untracked ones and those under .git/, testdata and ignored folders
      included, so a stray file where records are made makes them coverage-stale in every clean
      checkout. Until it is fixed, a checkout that records coverage holds no .go file git does not
      track; when fixed and pinned, nothing here changes but that warning in
      docs/mutation-baseline.md.

      itos-cc#36 and #37 no longer touch this repository since T-45 (decision 40, 2026-10-11):
      nothing is recorded, a counted run judges HEAD's tracked files in a private copy, and
      tools/bin/pinned no longer sets GOTOOLCHAIN. Whenever they land, nothing here changes.

      itos#45 (2026-10-11, found by T-45): itos ci run --help says the code proof reads recorded
      results and runs none of its own, while a counted proof runs coverage, a baseline and a mutant
      (about 70 s here). Nothing changes here when it is fixed.
    tags: [ci]
