      in any spelling in a render, after the answers replaced its five forms. An answer that itself
      holds the literal's words (the literal acme-widget answered acme-widget-2, or my-acme-widget)
      puts them back at every place the literal was replaced, so every replacement reads as a
      leftover and the report drowns the author in false ones. check could refuse or flag such an
      answer once, before rendering, or leave the answer's own text out of the scan; which is the
      person's call.
    tags: [check]
