  - id: template-contents-mutation
    title: docs/template-contents.md's code-quality design says what decision 40 chose
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      docs/template-contents.md's Code quality section, written before decision 40, gives a made
      project a mutation cache: the commit hook checks itos-cc's recorded results for the staged
      code and CI re-runs a sample of them. Decision 40 (T-45, 2026-10-11) settled this repository
      otherwise, as itos does: no cache, the code proof one fresh counted site a push over the
      changed functions with changed-line coverage, and twenty sites a night. Decision 27 says a
      template's projects carry the same gate, so the document says which one a made project gets
      before first-template carries it.
  - id: failing-git
    title: Tests make internal/git's real git fail on cue, so the adapter's error branches are covered
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      internal/git returns git's failures as its sealed errors (decision 17), and no test reaches
      those returns: T-43 counted 187 uncovered statements across cmd and internal, among them 8 in
      internal/git/project.go's Merge and relabel (lines 105, 109, 230, 234, 255, 260, 267, 273),
      each a return of a failed read-tree, ls-files, merge-file, update-index or empty blob. The
      changed-line proof (decision 40) asks for a test only when a push changes such a line. The way
      the person chose (2026-10-11): internal/git already runs the git ITOS_GIT names, so a test
      points it at a small Go helper the tests build (Windows runs no shell script) that runs the
      real git but fails the subcommand an environment variable names. Real git stays real (decision
      19), and nothing in production changes. Rejected: an interface over how internal/git runs
      commands, its stub failing the Nth call, since a test knowing the exact order of git calls is
      a mock in all but name (decision 19).
  - id: T-47
    title: Each package outside the domain keeps 80% of its statements covered by its unit tests and the scenarios together, judged nightly
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: task
    why: >
      The person's call (2026-10-11): code outside the domain gets a coverage floor too, judged
      nightly, while every push keeps only tools/bin/domain-coverage (T-13: each domain package 80%
      by its own unit tests) and decision 40's changed lines. Decision 19 leaves the adapters, the
      UI, the slices and cmd to the scenarios on the real git, so their figure counts what the
      scenarios run as well as their unit tests. Measured at 741ea9d, unit tests and scenarios
      together (go test -cover -covermode=atomic -coverpkg=./... ./cmd/... ./internal/... -args
      -test.gocoverdir=<dir>, and GOCOVERDIR=<dir> go test ./features -count=1, which builds the
      binary with -cover as T-19 made it; go tool covdata percent over both): cmd/itos-template
      94.4%, adopt 92.4%, check 91.3%, cli 97.5%, cutrelease 90.3%, disk 84.2%, git 87.1%,
      newproject 96.8%, program 100%, prompt 88.0%, tempdir 84.4%, update 83.3%, version 95.5%;
      93.6% of all statements of cmd and internal. The scenarios alone give far less where a test
      outside the domain covers what no scenario can reach (prompt 4%, tempdir 28%, disk 47%), so
      both count. Write tools/bin/e2e-coverage, as tools/bin/domain-coverage is written (a POSIX sh
      script, its comment saying what it holds and why, the packages read rather than listed): every
      package of cmd and internal that is not a domain package (the domain rule in .golangci.yml, as
      domain-coverage reads it), a port package (internal/**/port) or test support (porttest,
      releasetest, and any package only tests import), each held to 80% of its statements, the
      domain's floor; it prints each package's figure and the total, cut to one decimal as
      domain-coverage does, and exits 1 naming each package under the floor. Add it to ci.nightly in
      itos.yaml after the mutation step, with a comment, and nothing to ci.steps. Check that the
      nightly workflow has what the scenarios need (ci.yml's ci job sets up more than nightly.yml
      does), run the nightly by hand once after the push (gh workflow run nightly.yml), and report
      its run, the step's wall time and its figures. A package that falls under the floor later
      names a path to give a test, not a floor to lower.
