  - id: new-trust
    title: new runs the chosen branches' setup steps under --trust, naming a step that fails and leaving the render
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      new-steps prints a template's setup steps and runs none: a step is a template's code, and
      running it because a flag said so is how a clone of an unfamiliar repository executes what it
      never chose to. Copier's --trust is the shape for running them once someone needs it, under a
      name that says what it risks. q-43 moved it out of new-itos-setup, whose scenario runs the
      printed steps itself. Settle when promoted: whether the flag is --trust, what a step that
      fails or cannot start leaves (the render is committed before any step, so it stands), whether
      later steps still run, and the exit code; ADR-0031's consequences describe the failing case
      under --trust.

      The person's idea for the flag, 2026-10-09: a name that says what it risks, as Claude Code's
      --dangerously-skip-permissions does, such as --dangerously-run-template-steps (kebab-case, as
      every flag here is), rather than copier's --trust, which names what the person feels rather
      than what new does. Weigh it when promoting.
  - id: answer-invisible
    title: An answer holding a control or invisible character is refused, wherever it would land
    phase: 1
    owner: null
    status: todo
    depends_on: [new-steps]
    kind: slice
    why: >
      Was setup-answer-controls.
      new-steps refuses a control character in a manifest's setup word, since an escape sequence can
      make a terminal show another step than the one pasted. A question with no pattern takes any
      answer, so an answer holding one (from --answer, or a script's) reaches a printed step after
      substitution, inside single quotes but raw. The answer is the person's own, so less a threat
      than the template's, yet the printed line can still mislead or break a terminal. Settle in a
      scenario: refuse such an answer where it lands in a step, or refuse a control character in any
      answer.
