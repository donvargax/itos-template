      reason: 'Equivalent: with >= the loop runs once more only at k = 0, where it tests the empty prefix, which PRECIS FreeformClass takes (precis.NewFreeform sets no DisallowEmpty), so it breaks with k still 0 and names the same first rune.'
    - file: internal/cli/cli.go
