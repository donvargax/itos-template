# itos.yaml, written by itos init: this repository's rules for its commits,
# kept small to grow. itos config check validates it; itos config check
# --print-defaults prints every key it leaves to its default.
version: 1

# The itos release this repository runs: a global itos fetches it, checks it
# against these checksums and runs it. itos pin moves it to the newest.
pin:
  version: "7.0.0"
  checksums: "fdff7164d0711138ea119cc86f72bd4c3676efb455a7cfc1c4aa469d8ffc786c" # the SHA-256 of the release's checksums.txt

# The tasks: every commit but a feat, a fix or a docs names one in its Task
# footer (itos commit --task T-1), and itos task T-1 runs its checks.
ledger:
  files: "tasks/phase-{group}.yaml" # one file per phase: tasks/phase-1.yaml, …
  id: "T-\\d+"

commits:
  # The Conventional Commits types, held to commitlint's config-conventional
  # rules by itos's own lint.
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
  header_lint: { use: builtin }
  footers:
    Task:
      source: ledger
      required_for: [refactor, perf, test, build, ci, chore, style, revert]
      validate_for: all # a task named must be in the ledger
      read_at: commit # judged against the ledger the commit carries
    # The scenarios a feat or a fix turns green, by ID (itos commit --scenarios ID-CLI-01): live
    # ones, never @wip, judged against the feature files the commit carries.
    Scenarios:
      source: { tests: scenario }
      strip_prefix: "@"
      required_for: [feat, fix]
      validate_for: [feat, fix]
      must_be_live: true
      read_at: commit
    # The work registry item a commit belongs to, for the commits no task ties to it: a slice's
    # steps committed red first in a test commit, a spec in a docs commit, a chore it needs. Taken
    # in place of Task for those types, since a slice has no task (itos commit --item <id>).
    Item:
      source: registry
      validate_for: all
      read_at: commit # judged against the registry the commit carries
      in_place_of: { Task: [test, docs, chore] }
    # What a user of itos-template must change for the commit, or none (itos commit --upgrading
    # none): feat and fix are what a user can feel, and the release notes quote it (T-5). No since:
    # no commit before this rule is a feat or a fix, so verify finds none it would refuse.
    Upgrading:
      source: text
      required_for: [feat, fix]
  # No since: the repository had no commit, so every commit is judged.
  # Which paths each type may touch. docs needs no Task footer, so it may
  # touch only Markdown, docs/ and itos's data in tasks/; the rest, anything.
  scopes:
    docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

# The scenarios, features/*.feature, run by godog through go test against the binary built from
# this tree (features/README.md). -scenarios= is a regular expression over the scenarios' tags,
# which the harness turns into godog's tag filter, as godog's own takes only exact tags.
tests:
  scenario:
    adapter: gherkin
    root: features
    id: "ID-[A-Z]+-\\d+"
    tag_prefix: "@"
    wip_tag: "@wip"
    run:
      whole: "go test ./features -count=1"
      select: "go test ./features -count=1 -scenarios={pattern}"
      ids_pattern: "^@(?:{ids})$"
      join: { each: "(?:{p})", sep: "|" }
    recognize: # a task check read back as a selection, so CI runs it in the one run
      - { command: "go test ./features -count=1", as: whole }
      - { command: "go test ./features -count=1 -scenarios={pattern}", as: pattern }
      - { command: "itos tests smoke run scenario", as: smoke }
    smoke:
      { file: features/smoke.yaml, every_file: true, add_hint: "add one to features/smoke.yaml" }
    range_checks:
      # Outside feat and fix, live scenarios only move, unchanged: itos's own rule, judged by the
      # commit-msg hook and verify, so no commit but a feat or a fix weakens one.
      - { name: scenario-moves, builtin: moves, except_types: [feat, fix] }

hooks:
  bin: itos # the hooks call the global itos, which runs the release pinned

# The tags a work item may carry, so itos work list --tag shows one part of the work (T-7): the
# command an item changes, then the concerns that cut across commands.
work:
  tags: [new, check, update, sync, cli, ci, windows]

# The code proof (T-20, judged in CI since T-34, by counted runs since T-45 and decision 40): itos
# ci run makes the check a step of a push's plan when its range touches these paths, among the
# static steps and before the tests, {base} the range's start, so every commit since the last
# green run is judged; a failure fails the run, and so the release. No step in ci.steps declares
# it: itos adds it from this key (itos#28), and itos ci plan lists it. A plan with no range start,
# a whole run, has none. It judges one mutation site of the range's changed functions freshly,
# with no cache (nothing is recorded or committed), and fails on a survivor itos-cc.yaml does not
# except and on any Go block the range adds or changes that no test runs (=lines, itos-cc 0.12.0):
# old uncovered code beside a change is not the range's. A range with no site is not applicable
# and passes. --all-tests, the whole suite for each mutant, until the scenarios that reach a site
# can be listed (the idea listed-tests): they kill mutants the packages' own tests leave. Linux
# only, as CI's ci job is. The check names cmd and internal, so it judges exactly the paths that
# make it run: paths decides whether it runs, not what it judges (itos#24), and without them a
# change elsewhere (a comment in tools/bin) would be judged too.
proof:
  code:
    paths: ["{cmd,internal}/**/*.go"]
    check: "tools/bin/pinned itos-cc mutation run --count 1 --since {base} --fail-uncovered=lines --all-tests --json cmd internal"

# What CI runs on a push (.github/workflows/ci.yml): itos ci run over the range from the last green
# run, these steps in cost order, then the checks of the tasks the range names. Harvested from
# itos's (github.com/donvargax/itos, itos.yaml's ci). The platform jobs, every test on Linux, macOS
# and Windows, are the workflow's, not this plan's.
ci:
  steps: # every step of CI, in order; each states its cost
    - { run: "! gofmt -l cmd internal features | grep .", cost: static } # names each file gofmt would change
    - { run: go vet ./..., cost: static }
    # The locked install (T-21), after go vet, so the modules are downloaded already. go mod verify
    # checks the module cache against go.sum; go mod tidy -diff fails on a go.mod or go.sum that is
    # incomplete or holds what the code does not use. No -mod=readonly: it is go's default without
    # a vendor folder.
    - { run: go mod verify, cost: static }
    - { run: go mod tidy -diff, cost: static }
    - { run: itos tests smoke check scenario, cost: static }
    - { run: itos config check, cost: static } # the config, the ledger, the registry, the smoke set
    - { run: tools/bin/doc-caps, cost: static } # AGENTS.md and docs/ORCHESTRATING.md held to a size
    # Invisible characters in any tracked text file (T-32), Trojan Source (CVE-2021-42574) among
    # them: tools/bin/invisible-chars refuses a character a renderer draws as nothing, a format
    # character or a line or paragraph separator, each file and line named, and refuses when git
    # grep itself fails (T-33). Its pattern is written there alone (T-37), so this step, the prose
    # plan's and tools/hooks/pre-commit, which runs it over what is staged, cannot drift apart.
    - { run: tools/bin/invisible-chars, cost: static }
    # The linters and the vulnerability check, the commands tools/hooks/pre-commit runs, so the
    # versions are pinned in one place each (tools/bin/pinned, go.mod's tool block). That hook is
    # declared per clone (itos's decision 37), so CI is where they hold for every commit.
    # govulncheck asks the vulnerability database, so it is late.
    - { run: tools/bin/pinned golangci-lint run ./..., cost: static }
    - { run: go tool govulncheck -test ./..., cost: late }
    # The unit tests, the Go packages'. RAPID_CHECKS=1 runs each property of the domain on one random
    # case (decision 20), as fast as an example test, each push trying a new one.
    - { run: "RAPID_CHECKS=1 go test ./cmd/... ./internal/...", cost: late }
    # Each domain package keeps 80% of its statements covered by its unit tests (T-13), the
    # packages read from .golangci.yml's depguard domain rule. Its properties count, on a new random
    # case each run: a package that falls under with no change names a branch to pin with a test.
    - { run: tools/bin/domain-coverage, cost: late }
    # The one merged run of the scenarios: the smoke set and those the range names, the whole suite
    # when there is no green run to start from. The nightly runs no scenario suite of its own: the
    # whole suite is the smoke set's size, and the platform jobs run it on every push.
    - { tests: scenario }
  prose: # a range that touches only these runs only the prose steps: what a docs commit may touch
    paths: ["**/*.md", "docs/**", "tasks/**"]
    steps:
      - itos config check
      - tools/bin/doc-caps
      # a feature file or a doc can carry an invisible character too: the script ci.steps runs
      - tools/bin/invisible-chars
  # What .github/workflows/nightly.yml runs once a day, and by hand (itos ci run --nightly).
  nightly:
    steps:
      # itos-cc's counted run builds with Go offline (GOPROXY=off), so the modules are fetched
      # first, should the runner's module cache hold none.
      - { run: go mod download, cost: static }
      # Each package of cmd and internal outside the domain keeps 80% of its statements covered by
      # its unit tests and the scenarios together (T-47), the packages read as the script says.
      # Before the mutation step: a plan stops at its first failure, and the known survivors fail
      # that step about half the nights, which would leave the floor unjudged; coverage is
      # deterministic, so it fails first and plainly. Not a push's: a push holds the domain's floor
      # and its changed lines. A package under it names a path to give a test, not a floor to lower.
      - { run: tools/bin/e2e-coverage, cost: late }
      # Twenty mutation sites of cmd and internal judged freshly (decision 40, as itos's nightly),
      # drawn with no cache; a survivor itos-cc.yaml does not except fails the night, and the 50
      # docs/mutation-baseline.md lists will, until items kill them. --all-tests as in the proof.
      # Not --fail-uncovered: with no range, strict coverage judges every function, and T-43's
      # uncovered statements are a backlog of their own. The seed is the run's, GitHub's run id
      # (the time, run by hand), not HEAD's, so two nights on one commit draw differently; the
      # report names it, to reproduce a draw.
      - {
          run: 'tools/bin/pinned itos-cc mutation run --count 20 --all-tests --seed "${GITHUB_RUN_ID:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" --json cmd internal',
          cost: late,
        }
  # itos push waits for the run of the commit it pushed and exits with its result, and itos status
  # reads it. The range's start is ci.range's default: the last green run of ci.yml.
  watch: { provider: github }
