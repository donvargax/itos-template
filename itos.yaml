# itos.yaml, written by itos init: this repository's rules for its commits,
# kept small to grow. itos config check validates it; itos config check
# --print-defaults prints every key it leaves to its default.
version: 1

# The itos release this repository runs: a global itos fetches it, checks it
# against these checksums and runs it. itos pin moves it to the newest.
pin:
  version: "6.4.0"
  checksums: "1cbaecdb58205e4453c0ec21a9783ecf7a0ac6d4872b0d6493728a4a8a0185ab" # the SHA-256 of the release's checksums.txt

# The tasks: every commit but a feat, a fix or a docs names one in its Task
# footer (itos commit --task T-1), and itos task T-1 runs its checks.
ledger:
  files: "tasks/phase-{group}.yaml" # one file per phase: tasks/phase-1.yaml, …
  id: "T-\\d+"

commits:
  # The Conventional Commits types, held to commitlint's config-conventional
  # rules by itos's own lint.
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
  header_lint: { use: builtin }
  footers:
    Task:
      source: ledger
      required_for: [refactor, perf, test, build, ci, chore, style, revert]
      validate_for: all # a task named must be in the ledger
      read_at: commit # judged against the ledger the commit carries
    # The scenarios a feat or a fix turns green, by ID (itos commit --scenarios ID-CLI-01): live
    # ones, never @wip, judged against the feature files the commit carries.
    Scenarios:
      source: { tests: scenario }
      strip_prefix: "@"
      required_for: [feat, fix]
      validate_for: [feat, fix]
      must_be_live: true
      read_at: commit
    # The work registry item a commit belongs to, for the commits no task ties to it: a slice's
    # steps committed red first in a test commit, a spec in a docs commit, a chore it needs. Taken
    # in place of Task for those types, since a slice has no task (itos commit --item <id>).
    Item:
      source: registry
      validate_for: all
      read_at: commit # judged against the registry the commit carries
      in_place_of: { Task: [test, docs, chore] }
    # What a user of itos-template must change for the commit, or none (itos commit --upgrading
    # none): feat and fix are what a user can feel, and the release notes quote it (T-5). No since:
    # no commit before this rule is a feat or a fix, so verify finds none it would refuse.
    Upgrading:
      source: text
      required_for: [feat, fix]
  # No since: the repository had no commit, so every commit is judged.
  # Which paths each type may touch. docs needs no Task footer, so it may
  # touch only Markdown, docs/ and itos's data in tasks/; the rest, anything.
  scopes:
    docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

# The scenarios, features/*.feature, run by godog through go test against the binary built from
# this tree (features/README.md). -scenarios= is a regular expression over the scenarios' tags,
# which the harness turns into godog's tag filter, as godog's own takes only exact tags.
tests:
  scenario:
    adapter: gherkin
    root: features
    id: "ID-[A-Z]+-\\d+"
    tag_prefix: "@"
    wip_tag: "@wip"
    run:
      whole: "go test ./features -count=1"
      select: "go test ./features -count=1 -scenarios={pattern}"
      ids_pattern: "^@(?:{ids})$"
      join: { each: "(?:{p})", sep: "|" }
    recognize: # a task check read back as a selection, so CI runs it in the one run
      - { command: "go test ./features -count=1", as: whole }
      - { command: "go test ./features -count=1 -scenarios={pattern}", as: pattern }
      - { command: "itos tests smoke run scenario", as: smoke }
    smoke:
      { file: features/smoke.yaml, every_file: true, add_hint: "add one to features/smoke.yaml" }
    range_checks:
      # Outside feat and fix, live scenarios only move, unchanged: itos's own rule, judged by the
      # commit-msg hook and verify, so no commit but a feat or a fix weakens one.
      - { name: scenario-moves, builtin: moves, except_types: [feat, fix] }

hooks:
  bin: itos # the hooks call the global itos, which runs the release pinned

# What CI runs on a push (.github/workflows/ci.yml): itos ci run over the range from the last green
# run, these steps in cost order, then the checks of the tasks the range names. Harvested from
# itos's (github.com/donvargax/itos, itos.yaml's ci). The platform jobs, every test on Linux, macOS
# and Windows, are the workflow's, not this plan's.
ci:
  steps: # every step of CI, in order; each states its cost
    - { run: "! gofmt -l cmd internal features | grep .", cost: static } # names each file gofmt would change
    - { run: go vet ./..., cost: static }
    - { run: itos tests smoke check scenario, cost: static }
    - { run: itos config check, cost: static } # the config, the ledger, the registry, the smoke set
    - { run: tools/bin/doc-caps, cost: static } # AGENTS.md and docs/ORCHESTRATING.md held to a size
    # The linters and the vulnerability check, the commands tools/hooks/pre-commit runs, so the
    # versions are pinned in one place each (tools/bin/pinned, go.mod's tool block). That hook is
    # declared per clone (itos's decision 37), so CI is where they hold for every commit.
    # govulncheck asks the vulnerability database, so it is late.
    - { run: tools/bin/pinned golangci-lint run ./..., cost: static }
    - { run: go tool govulncheck -test ./..., cost: late }
    - { run: "go test ./cmd/... ./internal/...", cost: late } # the unit tests, the Go packages'
    # The one merged run of the scenarios: the smoke set and those the range names, the whole suite
    # when there is no green run to start from. No nightly yet: the whole suite is the smoke set's
    # size.
    - { tests: scenario }
  prose: # a range that touches only these runs only the prose steps: what a docs commit may touch
    paths: ["**/*.md", "docs/**", "tasks/**"]
    steps:
      - itos config check
      - tools/bin/doc-caps
  # itos push waits for the run of the commit it pushed and exits with its result, and itos status
  # reads it. The range's start is ci.range's default: the last green run of ci.yml.
  watch: { provider: github }
