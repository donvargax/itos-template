name: CI

# Harvested from itos's (github.com/donvargax/itos, .github/workflows/ci.yml), its TypeScript,
# nightly and own-build steps left behind; its release job calls release.yml (T-5). People push to
# main. Renovate pushes its renovate/** branches and fast-forwards main to one once this workflow is
# green on it (.github/renovate.json5, branch automerge, T-14), so it runs there too. A pull request
# is opened only for a branch that goes red, and it runs on that as well.
on:
  pull_request:
  push:
    branches: [main, "renovate/**"]

permissions:
  contents: read
  actions: read # the last green run, where a push's range starts

# A newer push replaces a run still waiting for the runner; a running one finishes. The newest run
# checks every commit since the last green one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  TO: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # One job, always run, always reported: a docs-only push still gets its green check, it just has
  # less to prove. What each range has to run is decided by itos ci run (itos.yaml's ci), so it is
  # the same decision locally.
  ci:
    runs-on: ubuntu-latest
    steps:
      # Every action pinned to a commit, as itos pins them: actions/checkout v4.4.0,
      # actions/setup-go v7.0.0, actions/setup-node v7.0.0, and itos's own action at v7.0.0-rc.1,
      # the release itos.yaml pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit re-check and the scope read the pushed range
      # Go for the build, the linters and the scenarios' steps (godog), the version go.mod's
      # toolchain line pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Node for T-14's checks, which run Renovate through npx. npx takes the newest Renovate whose
      # engines the Node on the PATH meets, and the runner's own Node 22 got Renovate 42, too old
      # for the config (commitTrailers, the renovate-config manager): Renovate 44 asks for Node 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The global itos, the launcher, on the PATH; itos.yaml's pin chooses the itos that runs.
      # Pinned by commit, so the version is named, as the action reads a version from its ref only.
      - uses: donvargax/itos@1b9f1f9995be5d20aed3b4f8877a453bbd1e98a3 # v7.0.0-rc.1
        with:
          version: 6.0.0
      # Where the range starts, computed once for every step below: a pull request's base, else
      # the head's nearest first parent with a green run of this workflow, on any branch, else
      # empty (run everything). On main that is the last green run; on a Renovate branch, the last
      # green run on main it descends from, or its own once it has one, so the range is what the
      # branch adds. Read from --json, since only machine output is itos's contract; jq fails the
      # step when the output has no string "from".
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      # The commit-msg hook's rules again, for commits made without hooks.
      - run: itos verify "$FROM" "$TO"
      # Every gate lives in one local command: itos.yaml's ci.steps, or its prose steps for a
      # docs-only range, then the checks of the tasks the range names. Its scenarios step is one
      # go test run over the smoke set and the scenarios the range names.
      - run: itos ci run "$FROM" "$TO"

  # Every test, the unit tests and the whole godog suite, on Linux, macOS and Windows, with each
  # platform's git, shell and paths: what touches paths and line endings breaks on Windows first.
  # The job's name holds the runner's OS word.
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git for Windows' bash on windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every failure.
      # The features build the binary themselves, itos-template.exe on windows.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan (decision 20).
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1

  # A push to main whose ci job and platform jobs are green cuts a release when its commits since
  # the last tag carry a feat, a fix or a breaking change (T-5; release.yml says how), as itos's
  # ci.yml calls its release. The only job with write access, granted here and to nothing else; a
  # pull request or a Renovate branch never releases. A dependency update fast-forwarded onto main
  # is a build or a ci commit, which cuts a patch only when it moves a module the binary links or
  # the Go toolchain (decision 23), and none otherwise.
  release:
    needs: [ci, platform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
