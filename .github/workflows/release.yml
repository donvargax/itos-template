name: Release

# The release, cut by CI (T-5), harvested from itos's (github.com/donvargax/itos,
# .github/workflows/release.yml, its T-069): ci.yml calls this after its ci and platform jobs pass
# on a push to main, and it releases when the commits since the last vX.Y.Z tag carry a feat, a
# fix or a breaking change, or the binary is built from other modules or another Go toolchain
# than the last release was. The tag is the version, computed from those commits
# (tools/bin/release-version): a breaking change a major, a feat a minor, a fix a patch; with
# none, a patch when the modules ./cmd/itos-template links or go.mod's toolchain moved (decision
# 23, T-15), go list reading both commits, which is why Go is set up before the version step;
# else nothing is released and the job ends green. With no tag yet the last version is 0.0.0, so
# the first release is v0.1.0. Its one gate of its own is that version against go.mod's module
# path (itos's T-089): a major the path does not end in (/vN from v2, nothing below) fails the
# version step, before any tag, since Go's module proxy would refuse that tag. Otherwise the push's
# CI is what a release rests on, and a break that slips through is a missing check, fixed forward
# with the check and a fix release.
#
# What it publishes (.goreleaser.yaml): the five archives, Linux and macOS on amd64 and arm64 and
# Windows on amd64, each binary stamped with the version, and checksums.txt. In order, all in this
# one job, since a tag pushed with the workflow's token starts no other workflow:
#   1. the version; nothing more when there is none;
#   2. the tag, made locally only;
#   3. GoReleaser (tools/bin/pinned, at the version pinned there) builds, packs and uploads a draft
#      release whose target is this commit;
#   4. the archives are attested (Sigstore, no keys; `gh attestation verify <file> -R
#      donvargax/itos-template` checks one). Attesting needs a public repository, as this one is,
#      or GitHub Enterprise Cloud: a private repository on GitHub Free or Team cannot attest, and
#      this step would fail there;
#   5. the notes are generated (tools/bin/release-notes: git-cliff over the range, every
#      BREAKING-CHANGE and Upgrading footer quoted);
#   6. the draft is published with those notes, which is when GitHub creates the tag, so the tag
#      and a release holding every asset appear together. A run that fails before leaves no tag,
#      only a draft the next run replaces; a tag is never moved.
# The releaser never commits: the notes are the release's description, not a file.
on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    # The only job given write access: the release and its assets, the OIDC token Sigstore signs
    # with, and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # One at a time, never cancelled, so pushes in a row cut their releases in order. ci.yml's
    # runs on main already wait for each other; this holds even if that changes.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Every action pinned to a commit, as ci.yml pins them: actions/checkout v4.4.0,
      # actions/setup-go v7.0.0, itos's own action at v6.4.0 (the release itos.yaml pins),
      # actions/attest-build-provenance v4.2.2.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags and the commits since the last one
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Version
        id: version
        run: |
          go run ./tools/bin/release-version > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/version.txt"
      # The global itos, for the notes' Upgrading footers (itos commit footers); itos.yaml's pin
      # chooses the itos that runs.
      - if: steps.version.outputs.next != ''
        uses: donvargax/itos@e64df756d607dd2312753890cdf32da29c2a9b32 # v6.4.0
        with:
          version: 6.0.0
      # The GitHub CLI, to publish the draft: pinned from its release tarball and checked against
      # its SHA-256, as itos installs it, so the runner's own copy does not decide what runs.
      - name: GitHub CLI
        if: steps.version.outputs.next != ''
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      # Local only: GoReleaser reads the version from it, and GitHub creates the remote tag when the
      # draft is published.
      - name: Tag
        if: steps.version.outputs.next != ''
        env:
          TAG: v${{ steps.version.outputs.next }}
        run: git tag "$TAG" "$GITHUB_SHA"
      - name: GoReleaser
        if: steps.version.outputs.next != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/bin/pinned goreleaser release --clean
      # checksums.txt lists every archive by name and SHA-256: each is a subject.
      - name: Attest
        if: steps.version.outputs.next != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/goreleaser/checksums.txt
      - name: Notes
        if: steps.version.outputs.next != ''
        env:
          LAST: ${{ steps.version.outputs.last }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          go run ./tools/bin/release-notes -version "$NEXT" -from "$LAST" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.next }}
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest
